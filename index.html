<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop - Order Online</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ── Reset & Base Variables ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Theme Color Palette - Warm Luxe Coffee */
      --brand-primary: #3d2410;
      --brand-primary-light: #523318;
      --brand-accent: #c88a4b;
      --brand-accent-hover: #b07538;
      --brand-accent-subtle: rgba(200, 138, 75, 0.12);
      
      --bg-main: #f8f6f3;
      --bg-card: #ffffff;
      --bg-elevated: #fffcf9;
      
      --text-main: #1e1915;
      --text-muted: #786f66;
      --text-light: #a3998e;
      
      --border-color: #eae5df;
      --border-focus: #c88a4b;
      
      /* Status Colors */
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --danger: #c62828;
      --danger-bg: #ffebee;
      
      /* Visual Elements */
      --shadow-sm: 0 2px 8px rgba(30, 25, 21, 0.04);
      --shadow-md: 0 8px 24px rgba(30, 25, 21, 0.07);
      --shadow-lg: 0 16px 36px rgba(30, 25, 21, 0.12);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --touch-min: 44px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1c8bd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    /* ── Header Hero Section ── */
    header {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #1a1613 100%);
      color: #ffffff;
      padding: 40px 20px 36px 20px;
      text-align: center;
      position: relative;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border-bottom: 3px solid var(--brand-accent);
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: radial-gradient(circle, rgba(200, 138, 75, 0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header h1 i {
      color: var(--brand-accent);
    }

    header p {
      font-size: 14px;
      color: var(--text-light);
      font-weight: 500;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Main Container ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Floating Cart Badge Button ── */
    .cart-badge {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: linear-gradient(135deg, var(--brand-accent), #965b21);
      color: #ffffff;
      padding: 0 22px;
      min-height: 56px;
      height: 56px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(200, 138, 75, 0.45);
      z-index: 500;
      transition: var(--transition);
      border: 2px solid rgba(255, 255, 255, 0.25);
      letter-spacing: 0.3px;
      gap: 10px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .cart-badge:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }

    .cart-badge .badge-count {
      background: #fff;
      color: var(--brand-primary);
      font-size: 12px;
      font-weight: 800;
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    .cart-badge:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 30px rgba(200, 138, 75, 0.5);
    }

    /* ── Menu Grid & Cards ── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 30px;
    }

    .menu-item {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .menu-item:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-accent);
    }

    .menu-emoji {
      font-size: 42px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .menu-emoji img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--brand-accent);
      font-weight: 800;
      margin-bottom: 4px;
    }

    .menu-name {
      font-weight: 800;
      font-size: 17px;
      color: var(--brand-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .menu-price {
      color: var(--brand-primary);
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 14px;
    }

    /* ── MODERN VARIANT CHIPS SELECTOR ── */
    .variant-wrapper {
      margin-bottom: 14px;
    }

    .variant-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .variant-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .variant-chip {
      padding: 8px 14px;
      background: var(--bg-main);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      outline: none;
      user-select: none;
    }

    .variant-chip:hover {
      border-color: var(--brand-accent);
      color: var(--brand-primary);
      background: var(--brand-accent-subtle);
      transform: translateY(-1px);
    }

    .variant-chip.active {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      color: #ffffff;
      border-color: var(--brand-accent);
      box-shadow: 0 4px 10px rgba(200, 138, 75, 0.35);
    }

    /* ── Quantity Control ── */
    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      background: var(--bg-main);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .quantity-control button {
      width: var(--touch-min);
      height: var(--touch-min);
      min-width: var(--touch-min);
      min-height: var(--touch-min);
      border: 1.5px solid var(--border-color);
      background: var(--bg-card);
      color: var(--brand-primary);
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .quantity-control button:hover {
      background: var(--brand-accent);
      color: #ffffff;
      border-color: var(--brand-accent);
    }

    .quantity-control input {
      width: 48px;
      text-align: center;
      border: none;
      background: transparent;
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
    }

    .quantity-control input:focus {
      outline: none;
    }

    .add-to-cart {
      width: 100%;
      padding: 14px;
      min-height: var(--touch-min);
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 800;
      font-family: inherit;
      transition: var(--transition);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }

    .add-to-cart:active {
      transform: scale(0.98);
    }

    .add-to-cart:focus-visible {
      outline: 3px solid var(--brand-accent);
      outline-offset: 2px;
    }

    .add-to-cart:hover {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(200, 138, 75, 0.3);
    }

    /* ── Modal Styling ── */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(18, 15, 12, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-primary);
    }

    .close-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .close-btn:hover {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: rgba(198, 40, 40, 0.2);
    }

    /* Cart Items in Modal */
    .cart-items {
      margin-bottom: 24px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .cart-item-variant {
      font-size: 12px;
      color: var(--brand-accent);
      font-weight: 600;
    }

    .cart-item-price {
      font-weight: 800;
      color: var(--brand-primary);
      width: 90px;
      text-align: right;
      font-size: 14px;
    }

    /* Cart Summary Box */
    .cart-summary {
      background: var(--bg-main);
      padding: 18px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .summary-total {
      font-weight: 800;
      font-size: 18px;
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
      margin-top: 8px;
      margin-bottom: 0;
      color: var(--brand-primary);
    }

    /* Form Styles in Modal */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--brand-accent-subtle);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group small {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Payment Option Selectors */
    .payment-methods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .payment-option {
      padding: 12px 8px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .payment-option i {
      font-size: 14px;
      color: var(--brand-accent);
    }

    .payment-option:hover {
      border-color: var(--brand-accent);
      background: var(--brand-accent-subtle);
      color: var(--brand-primary);
    }

    .payment-option input {
      display: none;
    }

    .payment-option:has(input:checked),
    .payment-option.selected {
      border-color: var(--brand-accent);
      background: var(--brand-accent-subtle);
      color: var(--brand-primary);
      box-shadow: 0 0 0 2px var(--brand-accent);
    }

    .proof-upload {
      display: none;
      margin-top: 18px;
    }

    .proof-upload.show {
      display: block;
    }

    /* Modal Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      color: #ffffff;
      flex: 1;
      box-shadow: 0 4px 14px rgba(200, 138, 75, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #b87b3d, #8d531a);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(200, 138, 75, 0.4);
    }

    .btn-secondary {
      background: #f0eae1;
      color: var(--brand-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #e2d9cc;
    }

    /* Alerts and Empty State */
    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-cart-icon {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--brand-accent);
      opacity: 0.8;
    }

    .success-message {
      display: none;
      background: var(--success-bg);
      color: var(--success);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid rgba(46, 125, 50, 0.2);
      font-size: 13.5px;
      font-weight: 700;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid rgba(198, 40, 40, 0.2);
      font-size: 13.5px;
      font-weight: 700;
    }

    .error-message.show {
      display: block;
    }


    /* ── Sticky Filter Toolbar ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 246, 243, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 14px 0 12px;
      margin: -8px 0 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .toolbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .search-wrap {
      position: relative;
      width: 100%;
    }

    .search-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 14px;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 14px;
      font-family: inherit;
      font-weight: 500;
      color: var(--text-main);
      background: var(--bg-card);
      transition: var(--transition);
      min-height: var(--touch-min);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--brand-accent);
      box-shadow: 0 0 0 4px var(--brand-accent-subtle);
    }

    .search-input::placeholder {
      color: var(--text-light);
    }

    .category-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .category-chips::-webkit-scrollbar { display: none; }

    .cat-chip {
      flex-shrink: 0;
      padding: 10px 18px;
      min-height: 40px;
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      font-size: 13px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .cat-chip:hover {
      border-color: var(--brand-accent);
      color: var(--brand-primary);
      background: var(--brand-accent-subtle);
    }

    .cat-chip.active {
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(61, 36, 16, 0.25);
    }

    .cat-chip:focus-visible {
      outline: 3px solid var(--brand-accent);
      outline-offset: 2px;
    }

    /* Skeleton loading */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }

    .skeleton-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px;
      border: 1px solid var(--border-color);
    }

    .skeleton-img {
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease infinite;
      margin-bottom: 16px;
    }

    .skeleton-line {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease infinite;
      margin-bottom: 10px;
    }

    .skeleton-line.short { width: 40%; }
    .skeleton-line.medium { width: 70%; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
    }

    .empty-state i {
      font-size: 48px;
      color: var(--brand-accent);
      margin-bottom: 16px;
      opacity: 0.7;
    }

    .empty-state h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-primary);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      max-width: 320px;
      margin: 0 auto;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      width: min(90vw, 380px);
    }

    .toast {
      background: var(--bg-card);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
      font-size: 13.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: toastIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
    }

    .toast.success { border-left: 4px solid var(--success); }
    .toast.error { border-left: 4px solid var(--danger); }
    .toast i { font-size: 16px; }
    .toast.success i { color: var(--success); }
    .toast.error i { color: var(--danger); }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }


    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 16px 14px 100px;
      }

      .toolbar-inner {
        padding: 0 14px;
      }

      .menu-grid, .skeleton-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 12px;
      }

      .menu-item {
        padding: 14px;
      }

      .menu-emoji {
        font-size: 32px;
      }

      .menu-name {
        font-size: 14px;
      }

      .menu-price {
        font-size: 15px;
      }

      .payment-methods {
        grid-template-columns: 1fr;
      }

      .cart-badge {
        bottom: 20px;
        right: 16px;
        height: 52px;
        min-height: 52px;
        padding: 0 18px;
        font-size: 13.5px;
      }

      .modal-content {
        padding: 22px;
        max-height: 92vh;
      }

      header {
        padding: 28px 16px 24px;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-mug-saucer" aria-hidden="true"></i> Coffee Shop Online</h1>
    <p>Pesan menu favorit Anda langsung dari meja atau mana saja</p>
  </header>

  <div class="toolbar" role="search">
    <div class="toolbar-inner">
      <div class="search-wrap">
        <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
        <input type="search" class="search-input" id="searchInput" placeholder="Cari menu..." aria-label="Cari menu" autocomplete="off">
      </div>
      <div class="category-chips" id="categoryChips" role="tablist" aria-label="Filter kategori">
        <button type="button" class="cat-chip active" data-category="all" role="tab" aria-selected="true">Semua</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="menuGrid" class="menu-grid" aria-live="polite"></div>
  </div>

  <div class="cart-badge" id="cartBadge" role="button" tabindex="0" aria-label="Buka keranjang" onclick="openCart()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openCart();}">
    <i class="fas fa-cart-shopping" aria-hidden="true"></i>
    <span id="cartBadgeText">Keranjang</span>
    <span class="badge-count" id="cartCount">0</span>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-receipt" style="color: var(--brand-accent); margin-right: 8px;"></i> Keranjang Belanja</h2>
        <button class="close-btn" onclick="closeCart()"><i class="fas fa-xmark"></i></button>
      </div>

      <div id="successMessage" class="success-message"></div>
      <div id="errorMessage" class="error-message"></div>

      <div id="cartItems" class="cart-items"></div>

      <div id="cartSummary" class="cart-summary">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">Rp 0</span>
        </div>
        <div class="summary-row">
          <span>Pajak (10%):</span>
          <span id="tax">Rp 0</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total:</span>
          <span id="total">Rp 0</span>
        </div>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Nama Pemesan *</label>
          <input type="text" id="customerName" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label>Nomor Meja *</label>
          <input type="text" id="tableNo" placeholder="Contoh: 5, A3" required>
        </div>

        <div class="form-group">
          <label>Metode Pembayaran *</label>
          <div class="payment-methods">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="cash" checked onchange="toggleProofUpload()">
              <span><i class="fas fa-money-bill-wave"></i> Cash</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="transfer" onchange="toggleProofUpload()">
              <span><i class="fas fa-building-columns"></i> Transfer</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="barcode" onchange="toggleProofUpload()">
              <span><i class="fas fa-qrcode"></i> QRIS</span>
            </label>
          </div>
        </div>

        <div id="proofUpload" class="proof-upload">
          <div class="form-group">
            <label>Bukti Pembayaran *</label>
            <input type="file" id="paymentProof" accept="image/*">
            <small>Upload foto bukti transfer/barcode pembayaran Anda</small>
          </div>
        </div>

        <div class="form-group">
          <label>Catatan Pesanan</label>
          <textarea id="notes" placeholder="Contoh: Kurang gula, tanpa es..."></textarea>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="closeCart()">Batal</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Pesan Sekarang</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let allMenuItems = [];
    let activeCategory = 'all';
    let searchQuery = '';

    function showSkeleton() {
      const grid = document.querySelector('.menu-grid');
      grid.innerHTML = `<div class="skeleton-grid">${Array(6).fill(0).map(() => `
        <div class="skeleton-card">
          <div class="skeleton-img"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line medium"></div>
          <div class="skeleton-line" style="width:50%"></div>
        </div>`).join('')}</div>`;
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'circle-check' : 'circle-exclamation'}" aria-hidden="true"></i> <span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    async function loadMenu() {
      showSkeleton();
      try {
        const response = await fetch('/api/list', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        allMenuItems = data.data || [];
        buildCategoryChips(allMenuItems);
        applyFilters();
      } catch (error) {
        console.error('Error loading menu:', error);
        document.querySelector('.menu-grid').innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation"></i>
            <h3>Gagal memuat menu</h3>
            <p>Periksa koneksi atau coba muat ulang halaman.</p>
          </div>`;
        showToast('Gagal memuat menu', 'error');
      }
    }

    function buildCategoryChips(items) {
      const cats = [...new Set(items.map(i => i.category).filter(Boolean))];
      const wrap = document.getElementById('categoryChips');
      wrap.innerHTML = `<button type="button" class="cat-chip active" data-category="all" role="tab" aria-selected="true">Semua</button>` +
        cats.map(c => `<button type="button" class="cat-chip" data-category="${c}" role="tab" aria-selected="false">${c}</button>`).join('');
      wrap.querySelectorAll('.cat-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.cat-chip').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-selected', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-selected', 'true');
          activeCategory = btn.dataset.category;
          applyFilters();
        });
      });
    }

    function applyFilters() {
      let filtered = allMenuItems;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(i => i.category === activeCategory);
      }
      if (searchQuery.trim()) {
        const q = searchQuery.toLowerCase();
        filtered = filtered.filter(i =>
          (i.name || '').toLowerCase().includes(q) ||
          (i.category || '').toLowerCase().includes(q) ||
          (i.description || '').toLowerCase().includes(q)
        );
      }
      displayMenu(filtered);
    }

    function displayMenu(menuItems) {
      const grid = document.querySelector('.menu-grid');
      if (!menuItems.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-mug-hot"></i>
            <h3>Menu tidak ditemukan</h3>
            <p>Coba kata kunci lain atau pilih kategori berbeda.</p>
          </div>`;
        return;
      }
      grid.innerHTML = menuItems.map(item => `
        <div class="menu-item">
          <div class="menu-emoji">
            ${item.image && (item.image.startsWith('data:') || item.image.startsWith('http')) ? `<img src="${item.image}" alt="${item.name}" loading="lazy" />` : `<span style="font-size: 48px;">${item.image || '☕'}</span>`}
          </div>
          <div class="menu-category">${item.category || ''}</div>
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">Rp ${Number(item.price).toLocaleString('id-ID')}</div>
          
          <div class="variant-wrapper">
            <label class="variant-label">Pilih Varian:</label>
            <div class="variant-chips">
              ${(item.variants || []).map(v => `
                <button type="button" class="variant-chip" onclick="selectVariantChip(this, '${v}')">${v}</button>
              `).join('')}
            </div>
            <select class="variant-select" data-menu-id="${item.id}" style="display:none;" aria-hidden="true">
              <option value="">Pilih varian...</option>
              ${(item.variants || []).map(v => `<option value="${v}">${v}</option>`).join('')}
            </select>
          </div>

          <div class="quantity-control">
            <button type="button" onclick="decreaseQty(this)" aria-label="Kurangi jumlah">−</button>
            <input type="number" class="qty-input" value="1" min="1" aria-label="Jumlah">
            <button type="button" onclick="increaseQty(this)" aria-label="Tambah jumlah">+</button>
          </div>

          <button class="add-to-cart" onclick="addToCart('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.price}, this)">
            <i class="fas fa-cart-plus" aria-hidden="true"></i> Tambah ke Keranjang
          </button>
        </div>
      `).join('');
    }

    // Helper untuk memilih Varian Chip
    function selectVariantChip(chipBtn, value) {
      const container = chipBtn.closest('.menu-item');
      const select = container.querySelector('.variant-select');
      
      // Reset status aktif chip lain dalam card yang sama
      container.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('active'));
      
      // Berikan class active ke chip yang ditekan
      chipBtn.classList.add('active');
      
      // Set nilai ke hidden select element
      select.value = value;
    }

    function increaseQty(btn) {
      const input = btn.previousElementSibling;
      input.value = parseInt(input.value) + 1;
    }

    function decreaseQty(btn) {
      const input = btn.nextElementSibling;
      if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
      }
    }

    function addToCart(menuId, menuName, price, button) {
      const container = button.parentElement;
      const variantSelect = container.querySelector('.variant-select');
      const qtyInput = container.querySelector('.qty-input');
      const variant = variantSelect.value;
      const quantity = parseInt(qtyInput.value);

      if (!variant) {
        alert('Pilih varian terlebih dahulu');
        return;
      }

      const item = {
        menuId: menuId,
        name: menuName,
        price: price,
        variant: variant,
        quantity: quantity
      };

      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      showToast(`${menuName} ditambahkan ke keranjang`);

      // Reset
      variantSelect.value = '';
      qtyInput.value = 1;

      // Hapus status active dari chip varian secara visual
      container.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('active'));

      // Show feedback
      button.innerHTML = '<i class="fas fa-check"></i> Ditambahkan';
      button.style.background = 'var(--success)';
      setTimeout(() => {
        button.innerHTML = '<i class="fas fa-cart-plus"></i> Tambah ke Keranjang';
        button.style.background = '';
      }, 1500);
    }

    function updateCartBadge() {
      const count = cart.reduce((sum, i) => sum + (i.quantity || 1), 0) || cart.length;
      const countEl = document.getElementById('cartCount');
      if (countEl) countEl.textContent = count;
      const badge = document.getElementById('cartBadge');
      if (badge) badge.setAttribute('aria-label', `Buka keranjang, ${count} item`);
    }

    function openCart() {
      document.querySelector('#cartModal').classList.add('active');
      displayCart();
    }

    function closeCart() {
      document.querySelector('#cartModal').classList.remove('active');
      clearMessages();
    }

    function displayCart() {
      const container = document.querySelector('#cartItems');
      const cartSummary = document.querySelector('#cartSummary');

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart"><div class="empty-cart-icon"><i class="fas fa-box-open"></i></div><p>Keranjang Anda masih kosong</p></div>';
        cartSummary.style.display = 'none';
        document.querySelector('#orderForm').style.display = 'none';
        return;
      }

      cartSummary.style.display = 'block';
      document.querySelector('#orderForm').style.display = 'block';

      let subtotal = 0;
      container.innerHTML = cart.map((item, idx) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name} (×${item.quantity})</div>
              <div class="cart-item-variant">${item.variant}</div>
            </div>
            <div class="cart-item-price">Rp ${itemTotal.toLocaleString('id-ID')}</div>
            <button type="button" onclick="removeFromCart(${idx})" style="background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(198,40,40,0.2); padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: bold;"><i class="fas fa-trash-can"></i></button>
          </div>
        `;
      }).join('');

      const tax = Math.round(subtotal * 0.1);
      const total = subtotal + tax;

      document.querySelector('#subtotal').textContent = `Rp ${subtotal.toLocaleString('id-ID')}`;
      document.querySelector('#tax').textContent = `Rp ${tax.toLocaleString('id-ID')}`;
      document.querySelector('#total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      displayCart();
    }

    function toggleProofUpload() {
      const method = document.querySelector('input[name="paymentMethod"]:checked').value;
      const proofUpload = document.querySelector('#proofUpload');
      const proofInput = document.querySelector('#paymentProof');

      if (method === 'cash') {
        proofUpload.classList.remove('show');
        proofInput.removeAttribute('required');
      } else {
        proofUpload.classList.add('show');
        proofInput.setAttribute('required', 'required');
      }
    }

    async function submitOrder(event) {
      event.preventDefault();
      clearMessages();

      if (cart.length === 0) {
        showError('Keranjang Anda masih kosong');
        return;
      }

      const customerName = document.querySelector('#customerName').value;
      const tableNo = document.querySelector('#tableNo').value;
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const notes = document.querySelector('#notes').value;
      const proofInput = document.querySelector('#paymentProof');

      let paymentProof = null;

      // Handle payment proof upload
      if (paymentMethod !== 'cash' && proofInput.files.length > 0) {
        try {
          const file = proofInput.files[0];
          paymentProof = await fileToBase64(file);
        } catch (error) {
          showError('Gagal mengupload bukti pembayaran');
          return;
        }
      }

      try {
        const response = await fetch('/api/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            customerName: customerName,
            tableNo: tableNo,
            items: cart,
            paymentMethod: paymentMethod,
            paymentProof: paymentProof,
            notes: notes
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Gagal membuat pesanan');
          return;
        }

        showSuccess(`<i class="fas fa-circle-check"></i> Pesanan berhasil dibuat! ID: ${data.orderId}`);
        
        // Clear cart
        cart = [];
        localStorage.removeItem('cart');
        updateCartBadge();
        displayCart();

        // Reset form
        document.querySelector('#orderForm').reset();
        toggleProofUpload();

        setTimeout(() => {
          closeCart();
        }, 2000);

      } catch (error) {
        console.error('Order error:', error);
        showError('Terjadi kesalahan saat membuat pesanan');
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(file);
      });
    }

    function showSuccess(message) {
      const el = document.querySelector('#successMessage');
      el.innerHTML = message;
      el.classList.add('show');
    }

    function showError(message) {
      const el = document.querySelector('#errorMessage');
      el.innerHTML = message;
      el.classList.add('show');
    }

    function clearMessages() {
      document.querySelector('#successMessage').classList.remove('show');
      document.querySelector('#errorMessage').classList.remove('show');
    }

    // Search input
    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      applyFilters();
    });

    // Initialize
    loadMenu();
    updateCartBadge();

    // Close modal when clicking outside
    document.querySelector('#cartModal').addEventListener('click', (e) => {
      if (e.target.id === 'cartModal') {
        closeCart();
      }
    });
  </script>
</body>
</html>
