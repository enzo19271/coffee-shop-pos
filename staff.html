<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard - Coffee Shop</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ── Reset & Color Variables ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Palette Cokelat Luxe & Kontras Tinggi */
      --brand-primary: #3d2410;
      --brand-primary-light: #523318;
      --brand-accent: #c88a4b;
      --brand-accent-hover: #b07538;
      --brand-accent-subtle: rgba(200, 138, 75, 0.12);
      
      --bg-main: #f8f6f3;
      --bg-card: #ffffff;
      
      --text-main: #1e1915;
      --text-muted: #786f66;
      --text-light: #a3998e;
      
      --border-color: #eae5df;
      --border-focus: #c88a4b;
      
      /* Indicator & Status Colors */
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --danger: #c62828;
      --danger-bg: #ffebee;
      --warning: #ef6c00;
      --warning-bg: #fff3e0;
      --info: #0277bd;
      --info-bg: #e1f5fe;

      /* Visual Design Rules */
      --shadow-sm: 0 2px 8px rgba(30, 25, 21, 0.04);
      --shadow-md: 0 8px 24px rgba(30, 25, 21, 0.08);
      --shadow-lg: 0 16px 36px rgba(30, 25, 21, 0.14);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1c8bd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    /* ── Top Header Bar ── */
    header {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #1a1613 100%);
      color: #ffffff;
      padding: 22px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--brand-accent);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 i {
      color: var(--brand-accent);
      font-size: 24px;
    }

    .logout-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(198, 40, 40, 0.3);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn:hover {
      background: var(--danger);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.25);
    }

    /* ── Container Layout ── */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Staff Greeting Banner ── */
    #welcomeMsg {
      background: var(--bg-card);
      padding: 20px 28px;
      border-radius: var(--radius-lg);
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 16px;
      color: var(--text-muted);
    }

    #welcomeMsg i {
      font-size: 22px;
      color: var(--brand-accent);
    }

    #welcomeMsg strong {
      color: var(--brand-primary);
      font-size: 18px;
    }

    /* ── Navigation Tabs ── */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 14px 26px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
    }

    .tab-btn i {
      font-size: 16px;
      color: var(--text-light);
      transition: var(--transition);
    }

    .tab-btn:hover {
      background: #ffffff;
      color: var(--brand-primary);
    }

    .tab-btn:hover i {
      color: var(--brand-accent);
    }

    .tab-btn.active {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: var(--brand-primary);
      box-shadow: 0 -4px 12px rgba(61, 36, 16, 0.15);
    }

    .tab-btn.active i {
      color: var(--brand-accent);
    }

    /* ── Tab Panels ── */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Order Card (Mudah Dibaca Pegawai) ── */
    .order-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--brand-accent);
      transition: var(--transition);
    }

    .order-card:hover {
      box-shadow: var(--shadow-md);
    }

    .order-card.completed {
      border-left-color: var(--success);
    }

    .order-card.rejected {
      border-left-color: var(--danger);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    .order-id {
      font-weight: 800;
      font-size: 18px;
      color: var(--brand-primary);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .order-status {
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .status-pending {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid rgba(239, 108, 0, 0.2);
    }

    .status-pending_verification {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid rgba(2, 119, 189, 0.2);
    }

    .status-confirmed {
      background: #e0f2f1;
      color: #00796b;
      border: 1px solid rgba(0, 121, 107, 0.2);
    }

    .status-completed {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(46, 125, 50, 0.2);
    }

    .status-rejected {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(198, 40, 40, 0.2);
    }

    /* Info Grid Detail Pesanan */
    .order-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px 24px;
      margin-bottom: 20px;
      background: var(--bg-main);
      padding: 18px 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label i {
      color: var(--brand-accent);
    }

    .info-value {
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
    }

    /* Items List */
    .order-items {
      background: #ffffff;
      padding: 18px 22px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1.5px solid var(--border-color);
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-total {
      font-weight: 800;
      color: var(--brand-primary);
      font-size: 18px;
      padding-top: 14px;
      margin-top: 8px;
      border-top: 2px dashed var(--border-color);
      text-align: right;
    }

    .payment-proof {
      margin-bottom: 20px;
      background: var(--bg-main);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .proof-image {
      max-width: 180px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 10px;
      border: 2px solid var(--border-color);
      transition: var(--transition);
      display: block;
    }

    .proof-image:hover {
      transform: scale(1.04);
      box-shadow: var(--shadow-sm);
    }

    /* Action Buttons (Besar & Kontras) */
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 800;
      transition: var(--transition);
      font-size: 13.5px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-confirm {
      background: var(--success);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }

    .btn-confirm:hover {
      background: #236327;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
    }

    .btn-reject {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.25);
    }

    .btn-reject:hover {
      background: #a31f1f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(198, 40, 40, 0.35);
    }

    .btn-complete {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(200, 138, 75, 0.3);
    }

    .btn-complete:hover {
      background: linear-gradient(135deg, #b87b3d, #8d531a);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(200, 138, 75, 0.4);
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      text-align: left;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-accent);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--brand-primary);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Forms ── */
    .expense-form {
      background: var(--bg-card);
      padding: 28px;
      border-radius: var(--radius-lg);
      max-width: 480px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .expense-form h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .expense-form h3 i {
      color: var(--brand-accent);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--brand-accent-subtle);
    }

    .expense-list {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .expense-info {
      flex: 1;
    }

    .expense-category {
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
      margin-bottom: 2px;
      text-transform: capitalize;
    }

    .expense-note {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .expense-amount {
      font-weight: 800;
      color: var(--danger);
      font-size: 17px;
      width: 140px;
      text-align: right;
    }

    /* ── Empty & Message Alert States ── */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--brand-accent);
      opacity: 0.8;
    }

    .empty-state p {
      font-size: 15px;
      font-weight: 700;
    }

    .success-message {
      display: none;
      background: var(--success-bg);
      color: var(--success);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid rgba(46, 125, 50, 0.2);
      font-size: 14px;
      font-weight: 700;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid rgba(198, 40, 40, 0.2);
      font-size: 14px;
      font-weight: 700;
    }

    .error-message.show {
      display: block;
    }

    /* ── Image Proof Modal ── */
    #imageModal {
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    @media (max-width: 768px) {
      header {
        padding: 16px 20px;
      }
      .container {
        padding: 20px 16px;
      }
      .order-info {
        grid-template-columns: 1fr 1fr;
      }
      .tabs {
        flex-wrap: wrap;
      }
      .tab-btn {
        flex: 1;
        min-width: 140px;
        padding: 12px 16px;
        font-size: 13px;
      }
      .action-buttons {
        flex-direction: column;
      }
      .action-buttons .btn {
        width: 100%;
      }
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--brand-accent);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <!-- Top Header -->
  <header>
    <h1><i class="fas fa-user-tie"></i> Staff Dashboard</h1>
    <button class="logout-btn" onclick="logout()">
      <i class="fas fa-right-from-bracket"></i> Logout
    </button>
  </header>

  <div class="container">
    <!-- Welcome message -->
    <div id="welcomeMsg">
      <i class="fas fa-mug-hot"></i>
      <div>Selamat datang, <strong id="staffName"></strong>!</div>
    </div>

    <!-- Tabs Nav -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders')">
        <i class="fas fa-clipboard-list"></i> Pesanan Masuk
      </button>
      <button class="tab-btn" onclick="switchTab('sales')">
        <i class="fas fa-chart-line"></i> Penjualan Hari Ini
      </button>
      <button class="tab-btn" onclick="switchTab('expenses')">
        <i class="fas fa-file-invoice-dollar"></i> Pencatatan Pengeluaran
      </button>
    </div>

    <!-- Tab: Orders -->
    <div id="tab-orders" class="tab-content active">
      <div id="successMessage" class="success-message"></div>
      <div id="errorMessage" class="error-message"></div>
      <div id="ordersList"></div>
    </div>

    <!-- Tab: Sales -->
    <div id="tab-sales" class="tab-content">
      <div class="stats-grid" id="salesStats"></div>
      <h3 style="margin-bottom: 20px; font-size: 18px; font-weight: 800; color: var(--brand-primary); display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-list-check" style="color: var(--brand-accent);"></i> Pesanan Hari Ini
      </h3>
      <div id="dailyOrdersList"></div>
    </div>

    <!-- Tab: Expenses -->
    <div id="tab-expenses" class="tab-content">
      <div id="successMessageExpense" class="success-message"></div>
      <div id="errorMessageExpense" class="error-message"></div>

      <div class="expense-form">
        <h3 style="margin-bottom: 20px;">
          <i class="fas fa-circle-plus"></i> Tambah Pengeluaran
        </h3>
        <form onsubmit="addExpense(event)">
          <div class="form-group">
            <label>Kategori *</label>
            <select id="expenseCategory" required>
              <option value="">Pilih kategori...</option>
              <option value="stok">Stok Bahan</option>
              <option value="peralatan">Peralatan</option>
              <option value="operasional">Operasional</option>
              <option value="lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label>Nominal (Rp) *</label>
            <input type="number" id="expenseAmount" min="1000" step="1000" placeholder="Contoh: 50000" required>
          </div>

          <div class="form-group">
            <label>Deskripsi</label>
            <textarea id="expenseDesc" placeholder="Contoh: Beli kopi arabika 5kg..." rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-confirm" style="width: 100%;">
            <i class="fas fa-floppy-disk"></i> Catat Pengeluaran
          </button>
        </form>
      </div>

      <div class="expense-list" id="expensesList"></div>
    </div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 15, 12, 0.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="position: relative;">
      <img id="modalImage" src="" alt="Proof" style="max-width: 90vw; max-height: 90vh; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); border: 2px solid var(--border-color);">
      <button onclick="closeImageModal()" style="position: absolute; top: -16px; right: -16px; background: var(--danger); color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: var(--shadow-md); font-weight: bold; display: flex; align-items: center; justify-content: center;">✕</button>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('staffToken');
    let currentStaff = JSON.parse(localStorage.getItem('currentStaff'));

    // Check if logged in
    if (!token || !currentStaff) {
      window.location.href = '/staff-login.html';
    }

    // Set welcome message
    document.querySelector('#staffName').textContent = currentStaff.name;

    function logout() {
      localStorage.removeItem('staffToken');
      localStorage.removeItem('currentStaff');
      window.location.href = '/staff-login.html';
    }

    function switchTab(tabName) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // Show selected tab
      document.querySelector(`#tab-${tabName}`).classList.add('active');
      event.target.closest('.tab-btn').classList.add('active');

      // Load content
      if (tabName === 'orders') {
        loadPendingOrders();
      } else if (tabName === 'sales') {
        loadSalesData();
      } else if (tabName === 'expenses') {
        loadExpenses();
      }
    }

    async function loadPendingOrders() {
      try {
        const response = await fetch('/api/pending', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load orders');

        const data = await response.json();
        displayPendingOrders(data.data);
      } catch (error) {
        console.error('Error:', error);
        document.querySelector('#ordersList').innerHTML = '<p style="color:var(--danger); font-weight:700;">Gagal memuat pesanan</p>';
      }
    }

    function displayPendingOrders(orders) {
      const container = document.querySelector('#ordersList');

      if (orders.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-inbox"></i></div><p>Tidak ada pesanan masuk</p></div>';
        return;
      }

      container.innerHTML = orders.map(order => `
        <div class="order-card ${order.status}">
          <div class="order-header">
            <div>
              <div class="order-id"><i class="fas fa-hashtag" style="color:var(--brand-accent);"></i> ${order.id}</div>
              <small style="color: var(--text-muted);"><i class="far fa-clock"></i> ${new Date(order.timestamp).toLocaleString('id-ID')}</small>
            </div>
            <div class="order-status status-${order.status}">${order.status.replace('_', ' ').toUpperCase()}</div>
          </div>

          <div class="order-info">
            <div class="info-item">
              <div class="info-label"><i class="fas fa-user"></i> Pemesan</div>
              <div class="info-value">${order.customer.name}</div>
            </div>
            <div class="info-item">
              <div class="info-label"><i class="fas fa-chair"></i> Nomor Meja</div>
              <div class="info-value">${order.customer.tableNo}</div>
            </div>
            <div class="info-item">
              <div class="info-label"><i class="fas fa-credit-card"></i> Metode Bayar</div>
              <div class="info-value">${order.paymentMethod.toUpperCase()}</div>
            </div>
            <div class="info-item">
              <div class="info-label"><i class="fas fa-wallet"></i> Total</div>
              <div class="info-value">Rp ${order.totalPrice.toLocaleString('id-ID')}</div>
            </div>
          </div>

          <div class="order-items">
            <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"><i class="fas fa-utensils"></i> PESANAN:</strong>
            ${order.items.map(item => `
              <div class="order-item">
                <span>• ${item.name} (${item.variant}) ×${item.quantity}</span>
                <span>Rp ${(item.price * item.quantity).toLocaleString('id-ID')}</span>
              </div>
            `).join('')}
            <div class="order-total">Total: Rp ${order.totalPrice.toLocaleString('id-ID')}</div>
          </div>

          ${order.paymentProof ? `
            <div class="payment-proof">
              <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"><i class="fas fa-image"></i> BUKTI PEMBAYARAN:</strong>
              <img src="${order.paymentProof}" class="proof-image" onclick="showImage(this.src)" alt="Proof">
            </div>
          ` : ''}

          ${order.notes ? `
            <div style="background: var(--bg-main); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 20px; font-size: 13.5px; border: 1px solid var(--border-color); color: var(--text-main);">
              <strong style="color: var(--brand-primary);"><i class="fas fa-pen"></i> Catatan:</strong> ${order.notes}
            </div>
          ` : ''}

          <div class="action-buttons">
            ${order.status === 'pending_verification' ? `
              <button class="btn btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')"><i class="fas fa-check"></i> Terima (Terverifikasi)</button>
              <button class="btn btn-reject" onclick="updateOrderStatus('${order.id}', 'rejected')"><i class="fas fa-xmark"></i> Tolak</button>
            ` : order.status === 'pending' ? `
              <button class="btn btn-confirm" onclick="updateOrderStatus('${order.id}', 'confirmed')"><i class="fas fa-check"></i> Terima Pesanan</button>
            ` : order.status === 'confirmed' ? `
              <button class="btn btn-complete" onclick="updateOrderStatus('${order.id}', 'completed')"><i class="fas fa-check-double"></i> Pesanan Siap</button>
            ` : ''}
          </div>
        </div>
      `).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const response = await fetch('/api/update-status', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            orderId: orderId,
            status: newStatus
          })
        });

        if (!response.ok) throw new Error('Failed to update order');

        showSuccessMessage('✓ Status pesanan berhasil diperbarui');
        loadPendingOrders();
      } catch (error) {
        console.error('Error:', error);
        showErrorMessage('Gagal memperbarui status pesanan');
      }
    }

    async function loadSalesData() {
      try {
        const response = await fetch('/api/summary?period=today', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load sales');

        const data = await response.json();
        displaySalesStats(data.data);
        loadPendingOrders(); // Reuse to show completed orders
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displaySalesStats(stats) {
      const container = document.querySelector('#salesStats');
      container.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${stats.totalOrders}</div>
          <div class="stat-label">Total Pesanan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.completedOrders}</div>
          <div class="stat-label">Pesanan Selesai</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalRevenue.toLocaleString('id-ID')}</div>
          <div class="stat-label">Total Penjualan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${Math.round(stats.averageOrderValue).toLocaleString('id-ID')}</div>
          <div class="stat-label">Rata-rata Pesanan</div>
        </div>
      `;
    }

    async function addExpense(event) {
      event.preventDefault();
      clearExpenseMessages();

      const category = document.querySelector('#expenseCategory').value;
      const amount = parseInt(document.querySelector('#expenseAmount').value);
      const description = document.querySelector('#expenseDesc').value;

      try {
        const response = await fetch('/api/add-expense', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            category: category,
            amount: amount,
            description: description,
            date: new Date().toISOString().split('T')[0]
          })
        });

        if (!response.ok) throw new Error('Failed to add expense');

        showSuccessMessageExpense('✓ Pengeluaran berhasil dicatat');
        
        // Reset form
        event.target.reset();
        
        // Reload expenses
        setTimeout(() => {
          loadExpenses();
        }, 1000);
      } catch (error) {
        console.error('Error:', error);
        showErrorMessageExpense('Gagal mencatat pengeluaran');
      }
    }

    async function loadExpenses() {
      const listEl = document.querySelector('#expensesList');
      listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 700;">Memuat...</p>';

      try {
        const response = await fetch('/api/expenses?period=today', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch expenses');

        const result = await response.json();
        const expenses = result.data || [];

        if (expenses.length === 0) {
          listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 700;">Belum ada pengeluaran hari ini</p>';
          return;
        }

        listEl.innerHTML = expenses.map(exp => `
          <div class="expense-item">
            <div class="expense-info">
              <div class="expense-category"><i class="fas fa-tag" style="color:var(--brand-accent); font-size:12px; margin-right:6px;"></i>${exp.category}</div>
              <div class="expense-note">${exp.description || '-'}</div>
            </div>
            <div class="expense-amount">Rp ${exp.amount.toLocaleString('id-ID')}</div>
          </div>
        `).join('');
      } catch (error) {
        listEl.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 40px; font-weight: 700;">Gagal memuat daftar pengeluaran</p>';
      }
    }

    function showImage(src) {
      document.querySelector('#modalImage').src = src;
      document.querySelector('#imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.querySelector('#imageModal').style.display = 'none';
    }

    function showSuccessMessage(msg) {
      const el = document.querySelector('#successMessage');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showErrorMessage(msg) {
      const el = document.querySelector('#errorMessage');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function clearMessages() {
      document.querySelector('#successMessage').classList.remove('show');
      document.querySelector('#errorMessage').classList.remove('show');
    }

    function showSuccessMessageExpense(msg) {
      const el = document.querySelector('#successMessageExpense');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showErrorMessageExpense(msg) {
      const el = document.querySelector('#errorMessageExpense');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function clearExpenseMessages() {
      document.querySelector('#successMessageExpense').classList.remove('show');
      document.querySelector('#errorMessageExpense').classList.remove('show');
    }

    // Load initial data
    loadPendingOrders();
  </script>
</body>
</html>
