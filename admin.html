<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Coffee Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6F4E37;
      --primary-dark: #5a4231;
      --primary-light: #8B6F47;
      --accent: #D4A574;
      --success: #52B788;
      --danger: #E63946;
      --warning: #F77F00;
      --info: #457B9D;
      --bg: #FEFDF7;
      --bg-secondary: #F8F6F1;
      --border: #E8DCC8;
      --text: #2B2520;
      --text-light: #7A6F67;
      --shadow: 0 4px 20px rgba(111, 78, 55, 0.12);
      --shadow-sm: 0 2px 8px rgba(111, 78, 55, 0.08);
    }

    body {
      font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 12px;
      opacity: 0.85;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.15);
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    .logout-btn {
      background: var(--danger);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: #d62828;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
    }

    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: 24px;
    }

    .welcome-card {
      background: linear-gradient(135deg, rgba(111, 78, 55, 0.05) 0%, rgba(212, 165, 116, 0.05) 100%);
      border: 1px solid var(--border);
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
    }

    .welcome-text {
      font-size: 16px;
    }

    .welcome-text strong {
      color: var(--primary);
      font-weight: 700;
    }

    .welcome-time {
      font-size: 12px;
      color: var(--text-light);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
      border-bottom: 2px solid var(--border);
      overflow-x: auto;
      padding-bottom: 0;
      flex-wrap: wrap;
    }

    .tab-btn {
      padding: 12px 18px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      color: var(--text-light);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--primary);
      background: rgba(111, 78, 55, 0.05);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: rgba(111, 78, 55, 0.05);
    }

    .tab-content {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .stat-card {
      background: white;
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--text-light);
      font-size: 13px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Form Styles */
    .form-card {
      background: white;
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
    }

    .form-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text);
      background: var(--bg-secondary);
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 3px rgba(111, 78, 55, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-primary {
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(111, 78, 55, 0.3);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary.secondary {
      background: var(--bg-secondary);
      color: var(--primary);
      border: 1px solid var(--border);
      margin-top: 8px;
    }

    .btn-primary.secondary:hover {
      background: var(--border);
      box-shadow: var(--shadow-sm);
    }

    /* Menu Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }

    .menu-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      transition: all 0.3s ease;
      position: relative;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .menu-emoji {
      font-size: 48px;
      text-align: center;
      margin-bottom: 12px;
      background: var(--bg-secondary);
      padding: 16px;
      border-radius: 8px;
    }

    .menu-name {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 4px;
      color: var(--primary);
    }

    .menu-category {
      font-size: 12px;
      color: var(--text-light);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .menu-price {
      color: var(--accent);
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .menu-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .btn-edit {
      background: var(--info);
      color: white;
    }

    .btn-edit:hover {
      background: #386c93;
      transform: translateY(-2px);
    }

    .btn-delete {
      background: var(--danger);
      color: white;
    }

    .btn-delete:hover {
      background: #d62828;
      transform: translateY(-2px);
    }

    /* Messages */
    .message {
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
      animation: slideIn 0.3s ease;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message.show {
      display: flex;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-10px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .success-message {
      background: rgba(82, 183, 136, 0.1);
      color: #2d6a4f;
      border: 1px solid rgba(82, 183, 136, 0.3);
    }

    .error-message {
      background: rgba(230, 57, 70, 0.1);
      color: #9e2c2c;
      border: 1px solid rgba(230, 57, 70, 0.3);
    }

    /* Transaction Cards */
    .txn-card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--info);
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      border-left: 4px solid var(--info);
    }

    .txn-card:hover {
      transform: translateX(4px);
      box-shadow: var(--shadow);
    }

    .txn-card.completed {
      border-left-color: var(--success);
    }

    .txn-card.rejected {
      border-left-color: var(--danger);
    }

    .txn-card.pending,
    .txn-card.pending_verification {
      border-left-color: var(--warning);
    }

    .txn-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .txn-id {
      font-weight: 700;
      font-size: 13px;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .txn-status {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: var(--bg-secondary);
      color: var(--primary);
      letter-spacing: 0.3px;
    }

    .txn-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .txn-body div strong {
      display: block;
      color: var(--text-light);
      font-size: 11px;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .txn-items {
      font-size: 13px;
      color: var(--text);
      background: var(--bg-secondary);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .txn-total {
      font-weight: 700;
      font-size: 18px;
      color: var(--primary);
      text-align: right;
    }

    .proof-thumb {
      max-width: 100px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .proof-thumb:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-sm);
    }

    /* Staff Cards */
    .staff-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      transition: all 0.3s ease;
    }

    .staff-card:hover {
      box-shadow: var(--shadow);
      border-color: var(--accent);
    }

    .staff-info strong {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
    }

    .staff-info span {
      color: var(--text-light);
      font-size: 12px;
    }

    .staff-role-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      background: linear-gradient(135deg, rgba(82, 183, 136, 0.2), rgba(82, 183, 136, 0.1));
      color: #2d6a4f;
      letter-spacing: 0.3px;
    }

    .staff-role-badge.admin {
      background: linear-gradient(135deg, rgba(230, 57, 70, 0.2), rgba(230, 57, 70, 0.1));
      color: #9e2c2c;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-light);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .filter-bar {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-group label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .filter-group input,
    .filter-group select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      background: var(--bg-secondary);
      color: var(--text);
      min-width: 150px;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }

    .finance-details {
      background: white;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 20px;
    }

    .finance-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }

    .finance-row:last-child {
      border-bottom: none;
    }

    .finance-row strong {
      color: var(--primary);
      font-weight: 700;
    }

    .finance-row .value {
      font-weight: 700;
      color: var(--accent);
      font-size: 16px;
    }

    @media (max-width: 768px) {
      .container {
        padding: 16px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      header {
        flex-direction: column;
        gap: 12px;
        padding: 12px 16px;
      }

      .header-left,
      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        gap: 4px;
      }

      .tab-btn {
        padding: 10px 12px;
        font-size: 12px;
      }

      .welcome-card {
        flex-direction: column;
        text-align: center;
        gap: 12px;
      }

      .txn-body {
        grid-template-columns: 1fr;
      }

      .filter-bar {
        flex-direction: column;
      }

      .filter-group input,
      .filter-group select {
        width: 100%;
        min-width: unset;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <div>
        <div class="header-title">☕ Coffee Admin</div>
        <div class="header-subtitle">Dashboard Management System</div>
      </div>
    </div>
    <div class="header-right">
      <div class="user-badge">
        👤 <span id="adminName">Admin</span>
      </div>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <div class="container">
    <div class="welcome-card">
      <div>
        <div class="welcome-text">Selamat datang kembali, <strong id="adminNameFull">Admin</strong>! 🎉</div>
        <div class="welcome-time" id="welcomeTime"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('analytics')">📊 Analytics</button>
      <button class="tab-btn" onclick="switchTab('menu')">🍽️ Menu</button>
      <button class="tab-btn" onclick="switchTab('transactions')">🧾 Transaksi</button>
      <button class="tab-btn" onclick="switchTab('staff')">👥 Staff</button>
      <button class="tab-btn" onclick="switchTab('finance')">💹 Keuangan</button>
    </div>

    <!-- Tab: Analytics -->
    <div id="tab-analytics" class="tab-content active">
      <div class="section-title">📊 Ringkasan Penjualan Hari Ini</div>
      <div class="stats-grid" id="analyticsStats"></div>
    </div>

    <!-- Tab: Menu Management -->
    <div id="tab-menu" class="tab-content">
      <div id="successMessage" class="message success-message"></div>
      <div id="errorMessage" class="message error-message"></div>

      <div class="form-card">
        <div class="form-title" id="menuFormTitle">➕ Tambah Menu Baru</div>
        <form id="menuForm" onsubmit="submitMenuForm(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Nama Menu *</label>
              <input type="text" id="menuName" required>
            </div>

            <div class="form-group">
              <label>Kategori *</label>
              <select id="menuCategory" required>
                <option value="">Pilih kategori...</option>
                <option value="Coffee">☕ Coffee</option>
                <option value="Cold Drinks">🧊 Cold Drinks</option>
                <option value="Pastry">🥐 Pastry</option>
                <option value="Food">🍲 Food</option>
              </select>
            </div>

            <div class="form-group">
              <label>Harga (Rp) *</label>
              <input type="number" id="menuPrice" min="1000" step="1000" required>
            </div>

            <div class="form-group">
              <label>Emoji/Icon *</label>
              <input type="text" id="menuEmoji" placeholder="Contoh: ☕" required>
            </div>
          </div>

          <div class="form-group">
            <label>Deskripsi</label>
            <textarea id="menuDesc" placeholder="Deskripsi singkat menu..."></textarea>
          </div>

          <div class="form-group">
            <label>Varian (pisahkan dengan koma)</label>
            <textarea id="menuVariants" placeholder="Contoh: Small,Medium,Large"></textarea>
          </div>

          <button type="submit" class="btn-primary" id="menuFormSubmitBtn">➕ Tambah Menu</button>
          <button type="button" class="btn-primary secondary" id="menuFormCancelBtn" style="display: none;" onclick="cancelEditMenu()">❌ Batal Edit</button>
        </form>
      </div>

      <div class="section-title">📋 Daftar Menu</div>
      <div class="menu-grid" id="menuList"></div>
    </div>

    <!-- Tab: Transaction History -->
    <div id="tab-transactions" class="tab-content">
      <div class="section-title">🧾 Riwayat Transaksi</div>

      <div class="filter-bar">
        <div class="filter-group">
          <label>Bulan</label>
          <input type="month" id="txnMonth">
        </div>
        <div class="filter-group">
          <label>Status</label>
          <select id="txnStatus">
            <option value="">Semua Status</option>
            <option value="pending">Pending</option>
            <option value="pending_verification">Menunggu Verifikasi</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Selesai</option>
            <option value="rejected">Ditolak</option>
          </select>
        </div>
        <button class="btn-primary" style="padding: 8px 20px; font-size: 13px;" onclick="loadTransactions()">🔍 Filter</button>
      </div>

      <div id="transactionsList"></div>
    </div>

    <!-- Tab: Staff Management -->
    <div id="tab-staff" class="tab-content">
      <div id="successMessageStaff" class="message success-message"></div>
      <div id="errorMessageStaff" class="message error-message"></div>

      <div class="form-card">
        <div class="form-title">➕ Tambah Staff Baru</div>
        <form onsubmit="addStaff(event)">
          <div class="form-grid">
            <div class="form-group">
              <label>Nama Lengkap *</label>
              <input type="text" id="staffName" required>
            </div>

            <div class="form-group">
              <label>Username *</label>
              <input type="text" id="staffUsername" required>
            </div>

            <div class="form-group">
              <label>Password *</label>
              <input type="password" id="staffPassword" minlength="4" required>
            </div>

            <div class="form-group">
              <label>Role *</label>
              <select id="staffRole" required>
                <option value="staff">👤 Staff</option>
                <option value="admin">👑 Admin</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn-primary">➕ Tambah Staff</button>
        </form>
      </div>

      <div class="section-title">👥 Daftar Staff</div>
      <div id="staffList"></div>
    </div>

    <!-- Tab: Financial Report -->
    <div id="tab-finance" class="tab-content">
      <div class="section-title">💹 Laporan Keuangan Bulan Ini</div>
      <div class="stats-grid" id="financeStats"></div>
      
      <div class="finance-details">
        <div class="section-title" style="margin-bottom: 16px;">📈 Rincian Keuangan</div>
        <div id="financeDetails"></div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('staffToken');
    let currentUser = JSON.parse(localStorage.getItem('currentStaff'));

    // Check if logged in and is admin
    if (!token || !currentUser || currentUser.role !== 'admin') {
      window.location.href = '/staff-login.html';
    }

    // Set welcome message
    document.querySelector('#adminName').textContent = currentUser.name;
    document.querySelector('#adminNameFull').textContent = currentUser.name;

    // Update welcome time
    function updateWelcomeTime() {
      const now = new Date();
      const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      const dayName = days[now.getDay()];
      const monthName = months[now.getMonth()];
      const timeStr = `${dayName}, ${now.getDate()} ${monthName} ${now.getFullYear()} - ${now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
      document.querySelector('#welcomeTime').textContent = timeStr;
    }
    updateWelcomeTime();
    setInterval(updateWelcomeTime, 60000);

    function logout() {
      localStorage.removeItem('staffToken');
      localStorage.removeItem('currentStaff');
      window.location.href = '/staff-login.html';
    }

    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      document.querySelector(`#tab-${tabName}`).classList.add('active');
      event.target.classList.add('active');

      if (tabName === 'analytics') {
        loadAnalytics();
      } else if (tabName === 'menu') {
        loadMenu();
      } else if (tabName === 'transactions') {
        loadTransactions();
      } else if (tabName === 'staff') {
        loadStaff();
      } else if (tabName === 'finance') {
        loadFinance();
      }
    }

    async function loadMenu() {
      try {
        const response = await fetch('/api/list');
        const data = await response.json();
        displayMenu(data.data);
      } catch (error) {
        console.error('Error:', error);
        showError('Gagal memuat menu');
      }
    }

    let editingMenuId = null;
    let currentMenuItems = [];

    function displayMenu(items) {
      currentMenuItems = items;
      const container = document.querySelector('#menuList');
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🍽️</div><p>Belum ada menu. Tambahkan menu baru untuk memulai!</p></div>';
        return;
      }
      container.innerHTML = items.map(item => `
        <div class="menu-card">
          <div class="menu-emoji">${item.image}</div>
          <div class="menu-name">${item.name}</div>
          <div class="menu-category">${item.category}</div>
          <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
          <div class="menu-actions">
            <button class="btn-small btn-edit" onclick="editMenu('${item.id}')">✏️ Edit</button>
            <button class="btn-small btn-delete" onclick="deleteMenu('${item.id}')">🗑️ Hapus</button>
          </div>
        </div>
      `).join('');
    }

    function submitMenuForm(event) {
      if (editingMenuId) {
        updateMenu(event);
      } else {
        addMenu(event);
      }
    }

    async function addMenu(event) {
      event.preventDefault();
      clearMessages();

      const name = document.querySelector('#menuName').value;
      const category = document.querySelector('#menuCategory').value;
      const price = parseInt(document.querySelector('#menuPrice').value);
      const emoji = document.querySelector('#menuEmoji').value;
      const description = document.querySelector('#menuDesc').value;
      const variantsStr = document.querySelector('#menuVariants').value;

      const variants = variantsStr ? variantsStr.split(',').map(v => v.trim()) : [];

      try {
        const response = await fetch('/api/add-menu', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, category, price, image: emoji, description, variants })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Failed to add menu');
        }

        showSuccess('✅ Menu berhasil ditambahkan!');
        event.target.reset();
        loadMenu();
      } catch (error) {
        showError('❌ ' + (error.message || 'Gagal menambahkan menu'));
      }
    }

    function editMenu(menuId) {
      const item = currentMenuItems.find(i => String(i.id) === String(menuId));
      if (!item) return;

      editingMenuId = item.id;

      document.querySelector('#menuName').value = item.name;
      document.querySelector('#menuCategory').value = item.category;
      document.querySelector('#menuPrice').value = item.price;
      document.querySelector('#menuEmoji').value = item.image;
      document.querySelector('#menuDesc').value = item.description || '';
      document.querySelector('#menuVariants').value = (item.variants || []).join(', ');

      document.querySelector('#menuFormTitle').textContent = `✏️ Edit Menu: ${item.name}`;
      document.querySelector('#menuFormSubmitBtn').textContent = '✏️ Update Menu';
      document.querySelector('#menuFormCancelBtn').style.display = 'block';

      document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
    }

    function cancelEditMenu() {
      editingMenuId = null;
      document.querySelector('#menuForm').reset();
      document.querySelector('#menuFormTitle').textContent = '➕ Tambah Menu Baru';
      document.querySelector('#menuFormSubmitBtn').textContent = '➕ Tambah Menu';
      document.querySelector('#menuFormCancelBtn').style.display = 'none';
    }

    async function updateMenu(event) {
      event.preventDefault();
      clearMessages();

      const name = document.querySelector('#menuName').value;
      const category = document.querySelector('#menuCategory').value;
      const price = parseInt(document.querySelector('#menuPrice').value);
      const emoji = document.querySelector('#menuEmoji').value;
      const description = document.querySelector('#menuDesc').value;
      const variantsStr = document.querySelector('#menuVariants').value;

      const variants = variantsStr ? variantsStr.split(',').map(v => v.trim()) : [];

      try {
        const response = await fetch(`/api/update-menu?id=${editingMenuId}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, category, price, image: emoji, description, variants })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Failed to update menu');
        }

        showSuccess('✅ Menu berhasil diupdate!');
        cancelEditMenu();
        loadMenu();
      } catch (error) {
        showError('❌ ' + (error.message || 'Gagal mengupdate menu'));
      }
    }

    async function deleteMenu(menuId) {
      if (!confirm('Hapus menu ini?')) return;

      try {
        const response = await fetch(`/api/update-menu?id=${menuId}`, {
          method: 'DELETE',
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Failed to delete menu');
        }

        showSuccess('✅ Menu berhasil dihapus!');
        loadMenu();
      } catch (error) {
        showError('❌ ' + (error.message || 'Gagal menghapus menu'));
      }
    }

    // ===== Transaction History =====
    const statusLabels = {
      pending: 'Pending',
      pending_verification: 'Menunggu Verifikasi',
      confirmed: 'Confirmed',
      completed: 'Selesai ✅',
      rejected: 'Ditolak ❌'
    };

    function initTxnMonthInput() {
      const now = new Date();
      const val = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      document.querySelector('#txnMonth').value = val;
    }

    async function loadTransactions() {
      const container = document.querySelector('#transactionsList');
      container.innerHTML = '<div class="empty-state"><p>Memuat...</p></div>';

      const monthInput = document.querySelector('#txnMonth');
      if (!monthInput.value) initTxnMonthInput();
      const month = monthInput.value;
      const status = document.querySelector('#txnStatus').value;

      try {
        const params = new URLSearchParams({ month });
        if (status) params.set('status', status);

        const response = await fetch(`/api/orders?${params.toString()}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load transactions');

        const result = await response.json();
        displayTransactions(result.data || []);
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Gagal memuat riwayat transaksi</p></div>';
      }
    }

    function displayTransactions(orders) {
      const container = document.querySelector('#transactionsList');

      if (orders.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🧾</div><p>Belum ada transaksi untuk periode ini</p></div>';
        return;
      }

      container.innerHTML = orders.map(order => `
        <div class="txn-card ${order.status}">
          <div class="txn-header">
            <div class="txn-id">${order.id}</div>
            <div class="txn-status">${statusLabels[order.status] || order.status}</div>
          </div>
          <div style="font-size: 12px; color: var(--text-light); margin-bottom: 12px;">
            ${new Date(order.timestamp).toLocaleString('id-ID')}
          </div>
          <div class="txn-body">
            <div><strong>👤 Nama Pembeli</strong>${order.customer?.name || '-'}</div>
            <div><strong>🪑 Nomor Meja</strong>${order.customer?.tableNo || '-'}</div>
            <div><strong>💳 Metode Pembayaran</strong>${(order.paymentMethod || '-').toUpperCase()}</div>
            <div><strong>📝 Dicatat Oleh</strong>${order.recordedBy || '-'}</div>
          </div>
          <div class="txn-items">
            <strong>📦 Items:</strong><br>
            ${(order.items || []).map(it => `• ${it.quantity}x ${it.name}${it.variant ? ' (' + it.variant + ')' : ''}`).join('<br>')}
          </div>
          ${order.notes ? `<div style="font-size:13px; color:var(--text); margin-bottom:12px; padding:10px; background: var(--bg-secondary); border-radius: 6px;"><strong>📌 Catatan:</strong> ${order.notes}</div>` : ''}
          ${order.paymentProof ? `<img src="${order.paymentProof}" class="proof-thumb" onclick="window.open('${order.paymentProof}', '_blank')" alt="Bukti pembayaran">` : ''}
          <div class="txn-total">Total: Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
        </div>
      `).join('');
    }

    // ===== Staff Management =====
    async function loadStaff() {
      const container = document.querySelector('#staffList');
      container.innerHTML = '<div class="empty-state"><p>Memuat...</p></div>';

      try {
        const response = await fetch('/api/staff', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load staff');

        const result = await response.json();
        displayStaff(result.data || []);
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">⚠️</div><p>Gagal memuat daftar staff</p></div>';
      }
    }

    function displayStaff(users) {
      const container = document.querySelector('#staffList');

      if (users.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">👥</div><p>Belum ada staff. Tambahkan staff baru untuk memulai!</p></div>';
        return;
      }

      container.innerHTML = users.map(u => `
        <div class="staff-card">
          <div class="staff-info">
            <strong>${u.name}</strong>
            <span>@${u.username} • Bergabung ${new Date(u.createdAt).toLocaleDateString('id-ID')}</span>
          </div>
          <span class="staff-role-badge ${u.role}">${u.role === 'admin' ? '👑 Admin' : '👤 Staff'}</span>
        </div>
      `).join('');
    }

    async function addStaff(event) {
      event.preventDefault();
      clearStaffMessages();

      const name = document.querySelector('#staffName').value;
      const username = document.querySelector('#staffUsername').value;
      const password = document.querySelector('#staffPassword').value;
      const role = document.querySelector('#staffRole').value;

      try {
        const response = await fetch('/api/add-staff', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ name, username, password, role })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Failed to add staff');
        }

        showSuccessStaff('✅ Staff berhasil ditambahkan!');
        event.target.reset();
        loadStaff();
      } catch (error) {
        showErrorStaff('❌ ' + (error.message || 'Gagal menambahkan staff'));
      }
    }

    function showSuccessStaff(msg) {
      const el = document.querySelector('#successMessageStaff');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showErrorStaff(msg) {
      const el = document.querySelector('#errorMessageStaff');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function clearStaffMessages() {
      document.querySelector('#successMessageStaff').classList.remove('show');
      document.querySelector('#errorMessageStaff').classList.remove('show');
    }

    async function loadAnalytics() {
      try {
        const response = await fetch('/api/summary?period=today', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load analytics');

        const data = await response.json();
        displayAnalytics(data.data);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displayAnalytics(stats) {
      const container = document.querySelector('#analyticsStats');
      container.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${stats.totalOrders}</div>
          <div class="stat-label">📦 Total Pesanan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.completedOrders}</div>
          <div class="stat-label">✅ Pesanan Selesai</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalRevenue.toLocaleString('id-ID')}</div>
          <div class="stat-label">💰 Total Penjualan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalExpenses.toLocaleString('id-ID')}</div>
          <div class="stat-label">📤 Total Pengeluaran</div>
        </div>
      `;
    }

    async function loadFinance() {
      try {
        const response = await fetch('/api/summary?period=thisMonth', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load finance');

        const data = await response.json();
        displayFinance(data.data);
      } catch (error) {
        console.error('Error:', error);
      }
    }

    function displayFinance(stats) {
      const container = document.querySelector('#financeStats');
      container.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalRevenue.toLocaleString('id-ID')}</div>
          <div class="stat-label">💰 Total Penjualan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalExpenses.toLocaleString('id-ID')}</div>
          <div class="stat-label">📤 Total Pengeluaran</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="color: ${stats.netProfit >= 0 ? 'var(--success)' : 'var(--danger)'};">
            Rp ${stats.netProfit.toLocaleString('id-ID')}
          </div>
          <div class="stat-label">📊 Net Profit</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.totalOrders}</div>
          <div class="stat-label">📋 Total Transaksi</div>
        </div>
      `;

      const details = document.querySelector('#financeDetails');
      details.innerHTML = `
        <div class="finance-row">
          <strong>💰 Total Penjualan:</strong>
          <span class="value">Rp ${stats.totalRevenue.toLocaleString('id-ID')}</span>
        </div>
        <div class="finance-row">
          <strong>📤 Total Pengeluaran:</strong>
          <span class="value">Rp ${stats.totalExpenses.toLocaleString('id-ID')}</span>
        </div>
        <div class="finance-row">
          <strong>📊 Keuntungan Bersih:</strong>
          <span class="value" style="color: ${stats.netProfit >= 0 ? 'var(--success)' : 'var(--danger)'};">Rp ${stats.netProfit.toLocaleString('id-ID')}</span>
        </div>
        <div class="finance-row">
          <strong>📋 Jumlah Transaksi:</strong>
          <span class="value">${stats.totalOrders}</span>
        </div>
        <div class="finance-row">
          <strong>💵 Rata-rata Per Transaksi:</strong>
          <span class="value">Rp ${Math.round(stats.averageOrderValue).toLocaleString('id-ID')}</span>
        </div>
      `;
    }

    function showSuccess(msg) {
      const el = document.querySelector('#successMessage');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function showError(msg) {
      const el = document.querySelector('#errorMessage');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }

    function clearMessages() {
      document.querySelector('#successMessage').classList.remove('show');
      document.querySelector('#errorMessage').classList.remove('show');
    }

    // Load initial data
    initTxnMonthInput();
    loadAnalytics();
    loadMenu();
  </script>
</body>
</html>
