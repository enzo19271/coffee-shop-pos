<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard - TAN COFFEE</title>
  
  <!-- Google Fonts: Fraunces (display) + DM Sans (UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ── Reset & Color Variables ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    
    :root {
      --font-ui: 'DM Sans', system-ui, -apple-system, sans-serif;
      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    }
    body {
      font-family: var(--font-ui) !important;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .brand-title, .app-title, .display-font,
    header h1, .app-brand-text h1, .sidebar-brand span {
      font-family: var(--font-display) !important;
      letter-spacing: -0.02em;
    }

    :root {
      /* Palette Cokelat Luxe & Kontras Tinggi */
      --brand-primary: #0B4D3A;
      --brand-primary-light: #0F5C45;
      --brand-accent: #1B7A54;
      --brand-accent-hover: #156344;
      --brand-accent-subtle: rgba(27, 122, 84, 0.12);
      
      --bg-main: #f8f6f3;
      --bg-card: #ffffff;
      
      --text-main: #1e1915;
      --text-muted: #786f66;
      --text-light: #a3998e;
      
      --border-color: #eae5df;
      --border-focus: #1B7A54;
      
      /* Indicator & Status Colors */
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --danger: #c62828;
      --danger-bg: #ffebee;
      --warning: #ef6c00;
      --warning-bg: #fff3e0;
      --info: #0277bd;
      --info-bg: #e1f5fe;

      /* Visual Design Rules */
      --shadow-sm: 0 2px 8px rgba(30, 25, 21, 0.04);
      --shadow-md: 0 8px 24px rgba(30, 25, 21, 0.08);
      --shadow-lg: 0 16px 36px rgba(30, 25, 21, 0.14);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    body {
      font-family: var(--font-ui), -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1c8bd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    /* ── Top Header Bar ── */
    header {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #041F18 100%);
      color: #ffffff;
      padding: 22px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      border-bottom: 3px solid var(--brand-accent);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 i {
      color: var(--brand-accent);
      font-size: 24px;
    }

    .logout-btn {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(198, 40, 40, 0.3);
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logout-btn:hover {
      background: var(--danger);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.25);
    }

    /* ── Container Layout ── */
    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Staff Greeting Banner ── */
    #welcomeMsg {
      background: var(--bg-card);
      padding: 20px 28px;
      border-radius: var(--radius-lg);
      margin-bottom: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 16px;
      color: var(--text-muted);
    }

    #welcomeMsg i {
      font-size: 22px;
      color: var(--brand-accent);
    }

    #welcomeMsg strong {
      color: var(--brand-primary);
      font-size: 18px;
    }

    /* ── Navigation Tabs ── */
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
    }

    .tab-btn {
      padding: 14px 26px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
    }

    .tab-btn i {
      font-size: 16px;
      color: var(--text-light);
      transition: var(--transition);
    }

    .tab-btn:hover {
      background: #ffffff;
      color: var(--brand-primary);
    }

    .tab-btn:hover i {
      color: var(--brand-accent);
    }

    .tab-btn.active {
      background: var(--brand-primary);
      color: #ffffff;
      border-color: var(--brand-primary);
      box-shadow: 0 -4px 12px rgba(61, 36, 16, 0.15);
    }

    .tab-btn.active i {
      color: var(--brand-accent);
    }

    /* ── Tab Panels ── */
    .tab-content {
      display: none;
      animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Order Card (Mudah Dibaca Pegawai) ── */
    .order-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--brand-accent);
      transition: var(--transition);
    }

    .order-card:hover {
      box-shadow: var(--shadow-md);
    }

    .order-card.completed {
      border-left-color: var(--success);
    }

    .order-card.rejected {
      border-left-color: var(--danger);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    .order-id {
      font-weight: 800;
      font-size: 18px;
      color: var(--brand-primary);
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .order-status {
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .status-pending {
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid rgba(239, 108, 0, 0.2);
    }

    .status-pending_verification {
      background: var(--info-bg);
      color: var(--info);
      border: 1px solid rgba(2, 119, 189, 0.2);
    }

    .status-confirmed {
      background: #e0f2f1;
      color: #00796b;
      border: 1px solid rgba(0, 121, 107, 0.2);
    }

    .status-completed {
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(46, 125, 50, 0.2);
    }

    .status-rejected {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid rgba(198, 40, 40, 0.2);
    }

    /* Info Grid Detail Pesanan */
    .order-info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px 24px;
      margin-bottom: 20px;
      background: var(--bg-main);
      padding: 18px 22px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label i {
      color: var(--brand-accent);
    }

    .info-value {
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
    }

    /* Items List */
    .order-items {
      background: #ffffff;
      padding: 18px 22px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1.5px solid var(--border-color);
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .order-total {
      font-weight: 800;
      color: var(--brand-primary);
      font-size: 18px;
      padding-top: 14px;
      margin-top: 8px;
      border-top: 2px dashed var(--border-color);
      text-align: right;
    }

    .payment-proof {
      margin-bottom: 20px;
      background: var(--bg-main);
      padding: 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .proof-image {
      max-width: 180px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-top: 10px;
      border: 2px solid var(--border-color);
      transition: var(--transition);
      display: block;
    }

    .proof-image:hover {
      transform: scale(1.04);
      box-shadow: var(--shadow-sm);
    }

    /* Action Buttons (Besar & Kontras) */
    .action-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 800;
      transition: var(--transition);
      font-size: 13.5px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-confirm {
      background: var(--success);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
    }

    .btn-confirm:hover {
      background: #236327;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(46, 125, 50, 0.35);
    }

    .btn-reject {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(198, 40, 40, 0.25);
    }

    .btn-reject:hover {
      background: #a31f1f;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(198, 40, 40, 0.35);
    }

    .btn-complete {
      background: linear-gradient(135deg, var(--brand-accent), #156344);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(27, 122, 84, 0.3);
    }

    .btn-complete:hover {
      background: linear-gradient(135deg, #b87b3d, #8d531a);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(27, 122, 84, 0.4);
    }

    /* ── Stats Grid ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      text-align: left;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-accent);
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: var(--brand-primary);
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Forms ── */
    .expense-form {
      background: var(--bg-card);
      padding: 28px;
      border-radius: var(--radius-lg);
      max-width: 480px;
      margin-bottom: 32px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .expense-form h3 {
      font-size: 18px;
      font-weight: 800;
      color: var(--brand-primary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .expense-form h3 i {
      color: var(--brand-accent);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--brand-accent-subtle);
    }

    .expense-list {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-color);
    }

    .expense-item:last-child {
      border-bottom: none;
    }

    .expense-info {
      flex: 1;
    }

    .expense-category {
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
      margin-bottom: 2px;
      text-transform: capitalize;
    }

    .expense-note {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .expense-amount {
      font-weight: 800;
      color: var(--danger);
      font-size: 17px;
      width: 140px;
      text-align: right;
    }

    /* ── Empty & Message Alert States ── */
    .empty-state {
      text-align: center;
      padding: 56px 20px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px dashed var(--border-color);
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
      color: var(--brand-accent);
      opacity: 0.8;
    }

    .empty-state p {
      font-size: 15px;
      font-weight: 700;
    }

    .success-message {
      display: none;
      background: var(--success-bg);
      color: var(--success);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid rgba(46, 125, 50, 0.2);
      font-size: 14px;
      font-weight: 700;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 16px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid rgba(198, 40, 40, 0.2);
      font-size: 14px;
      font-weight: 700;
    }

    .error-message.show {
      display: block;
    }

    /* ── Global Toast Overlay ── */
    #toastContainer {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2147483646;
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: min(92vw, 420px);
      pointer-events: none;
    }
    .toast-item {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 12px 40px rgba(0,0,0,0.18);
      animation: toastIn 0.28s cubic-bezier(0.4,0,0.2,1);
      border: 1px solid transparent;
      line-height: 1.4;
    }
    .toast-item.success {
      background: #e8f5e9;
      color: #1b5e20;
      border-color: rgba(46,125,50,0.25);
    }
    .toast-item.error {
      background: #ffebee;
      color: #b71c1c;
      border-color: rgba(198,40,40,0.25);
    }
    .toast-item.info {
      background: #e3f2fd;
      color: #0d47a1;
      border-color: rgba(2,119,189,0.25);
    }
    .toast-item i { font-size: 18px; margin-top: 1px; flex-shrink: 0; }
    .toast-item .toast-body { flex: 1; }
    .toast-item .toast-close {
      background: transparent; border: none; cursor: pointer;
      color: inherit; opacity: 0.6; font-size: 16px; padding: 0 2px;
      line-height: 1;
    }
    .toast-item .toast-close:hover { opacity: 1; }
    .toast-item.hiding { animation: toastOut 0.25s ease forwards; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(-8px) scale(0.96); }
    }

    /* ── Tab badge ── */
    .tab-badge {
      display: none;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #e53935 !important;
      color: #fff !important;
      font-size: 11px;
      font-weight: 800;
      align-items: center;
      justify-content: center;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(229,57,53,0.45);
      margin-left: 4px;
      flex-shrink: 0;
    }
    .tab-badge.show { display: inline-flex !important; }
    .tab-btn.active .tab-badge {
      background: #fff !important;
      color: #c62828 !important;
      box-shadow: 0 0 0 1px rgba(198,40,40,0.25);
    }

    /* ── Order sections & accordion ── */
    /* Order sub-tabs (Baru Masuk / Siap Disiapkan) */
    .order-subtabs {
      display: flex;
      gap: 8px;
      margin: 4px 0 16px;
      padding: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
    }
    .order-subtab {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 10px;
      border: none;
      border-radius: 11px;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: var(--transition);
      min-height: 44px;
    }
    .order-subtab i { font-size: 14px; opacity: 0.85; }
    .order-subtab .sub-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: #e8e4df;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .order-subtab.active {
      background: var(--brand-primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(11, 77, 58, 0.25);
    }
    .order-subtab.active .sub-count {
      background: #fff;
      color: #c62828;
    }
    .order-subtab.active.prep .sub-count {
      color: #00796b;
    }
    .order-subtab:not(.active):hover {
      background: rgba(27, 122, 84, 0.06);
      color: var(--brand-primary);
    }

    .orders-section {
      margin-bottom: 28px;
    }
    .orders-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      color: var(--brand-primary);

        <div class="app-sub">Staff · <span id="staffName">...</span></div>
      </div>
    </div>
    <button class="logout-btn" onclick="logout()" aria-label="Logout">
      <i class="fas fa-right-from-bracket"></i>
      <span class="logout-text">Logout</span>
    </button>
  </header>

  <div class="container">

    <!-- Tabs Nav -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('orders')" id="tabBtnOrders">
        <i class="fas fa-clipboard-list"></i> Pesanan Masuk
        <span class="tab-badge" id="ordersBadge">0</span>
      </button>
      <button class="tab-btn" onclick="switchTab('kasir')">
        <i class="fas fa-cash-register"></i> Buat Pesanan
      </button>
      <button class="tab-btn" onclick="switchTab('sales')">
        <i class="fas fa-chart-line"></i> Penjualan
      </button>
      <button class="tab-btn" onclick="switchTab('expenses')">
        <i class="fas fa-file-invoice-dollar"></i> Pengeluaran
      </button>
    </div>

    <!-- Tab: Orders -->
    <div id="tab-orders" class="tab-content active">
      <div id="successMessage" class="success-message"></div>
      <div id="errorMessage" class="error-message"></div>
      <div class="order-subtabs" role="tablist" aria-label="Filter pesanan">
        <button type="button" class="order-subtab active" id="subtabIncoming" onclick="setOrderSubTab('incoming')" role="tab" aria-selected="true">
          <i class="fas fa-bell"></i> Baru Masuk
          <span class="sub-count" id="countIncoming">0</span>
        </button>
        <button type="button" class="order-subtab prep" id="subtabPreparing" onclick="setOrderSubTab('preparing')" role="tab" aria-selected="false">
          <i class="fas fa-fire-burner"></i> Siap Disiapkan
          <span class="sub-count" id="countPreparing">0</span>
        </button>
      </div>
      <div id="ordersList"></div>
    </div>

    <!-- Tab: Kasir / Buat Pesanan -->
    <div id="tab-kasir" class="tab-content">
      <div id="kasirSuccess" class="success-message"></div>
      <div id="kasirError" class="error-message"></div>
      <div class="kasir-layout">
        <div class="kasir-menu-panel">
          <h3 class="kasir-section-title"><i class="fas fa-mug-saucer"></i> Pilih Menu</h3>
          <div class="kasir-toolbar">
            <div class="kasir-search">
              <i class="fas fa-magnifying-glass"></i>
              <input type="search" id="kasirSearch" placeholder="Cari menu..." autocomplete="off" aria-label="Cari menu">
            </div>
            <div class="kasir-shortcuts" id="kasirCatShortcuts">
              <button type="button" class="kasir-shortcut active" data-cat="all">Semua</button>
            </div>
          </div>
          <div id="kasirMenuList" class="kasir-menu-list"></div>
        </div>
        <div class="kasir-cart-panel">
          <h3 class="kasir-section-title"><i class="fas fa-receipt"></i> Pesanan Kasir</h3>
          <div id="kasirCartItems" class="kasir-cart-items"></div>
          <div class="kasir-total-row">
            <span>Total</span>
            <strong id="kasirTotal">Rp 0</strong>
          </div>
          <form id="kasirForm" onsubmit="submitKasirOrder(event)">
            <div class="form-group">
              <label>Nama Pelanggan</label>
              <input type="text" id="kasirCustomerName" placeholder="Nama / Walk-in" required>
            </div>
            <div class="form-group">
              <label>No. Meja / Ambil</label>
              <input type="text" id="kasirTableNo" value="Kasir" placeholder="Kasir / Takeaway / No meja" required>
            </div>
            <div class="form-group">
              <label>Kode Voucher (opsional)</label>
              <input type="text" id="kasirVoucherCode" placeholder="TC-XXXX" style="text-transform:uppercase;">
              <small id="kasirVoucherHint" style="display:block;margin-top:6px;font-size:12px;color:var(--text-muted);font-weight:600;"></small>
            </div>
            <div class="form-group">
              <label>Metode Bayar</label>
              <div class="payment-methods" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;">
                <label class="payment-option"><input type="radio" name="kasirPay" value="cash" checked> <span><i class="fas fa-money-bill-wave"></i> Cash</span></label>
                <label class="payment-option"><input type="radio" name="kasirPay" value="transfer"> <span><i class="fas fa-building-columns"></i> Transfer</span></label>
                <label class="payment-option"><input type="radio" name="kasirPay" value="barcode"> <span><i class="fas fa-qrcode"></i> QRIS</span></label>
              </div>
            </div>
            <div class="form-group">
              <label>Catatan</label>
              <textarea id="kasirNotes" rows="2" placeholder="Opsional..."></textarea>
            </div>
            <button type="submit" class="btn btn-confirm" style="width:100%;min-height:48px;">
              <i class="fas fa-check-double"></i> Buat Pesanan (Auto Verifikasi)
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Professional variant picker overlay -->
    <div class="kasir-overlay" id="kasirOverlay" role="dialog" aria-modal="true" aria-labelledby="kasirSheetTitle">
      <div class="kasir-sheet" id="kasirSheet">
        <div class="kasir-sheet-head">
          <div id="kasirSheetThumb"></div>
          <div>
            <h3 id="kasirSheetTitle">Menu</h3>
            <div class="price" id="kasirSheetPrice">Rp 0</div>
          </div>
        </div>
        <div class="label">Pilih Varian</div>
        <div class="variant-btns" id="kasirVariantBtns"></div>
        <div class="sheet-qty-row">
          <div class="label" style="margin:0;">Jumlah</div>
          <div class="sheet-qty">
            <button type="button" id="kasirSheetMinus" aria-label="Kurangi">−</button>
            <span id="kasirSheetQty">1</span>
            <button type="button" id="kasirSheetPlus" aria-label="Tambah">+</button>
          </div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="sheet-cancel" id="kasirSheetCancel">Batal</button>
          <button type="button" class="sheet-add" id="kasirSheetAdd"><i class="fas fa-cart-plus"></i> Tambah</button>
        </div>
      </div>
    </div>

    <!-- Tab: Sales -->
    <div id="tab-sales" class="tab-content">
      <div class="stats-grid" id="salesStats"></div>
      <h3 style="margin-bottom: 20px; font-size: 18px; font-weight: 800; color: var(--brand-primary); display: flex; align-items: center; gap: 10px;">
        <i class="fas fa-list-check" style="color: var(--brand-accent);"></i> Pesanan Hari Ini
      </h3>
      <div id="dailyOrdersList"></div>
    </div>

    <!-- Tab: Expenses -->
    <div id="tab-expenses" class="tab-content">
      <div id="successMessageExpense" class="success-message"></div>
      <div id="errorMessageExpense" class="error-message"></div>

      <div class="expense-form">
        <h3 style="margin-bottom: 20px;">
          <i class="fas fa-circle-plus"></i> Tambah Pengeluaran
        </h3>
        <form onsubmit="addExpense(event)">
          <div class="form-group">
            <label>Kategori *</label>
            <select id="expenseCategory" required>
              <option value="">Pilih kategori...</option>
              <option value="stok">Stok Bahan</option>
              <option value="peralatan">Peralatan</option>
              <option value="operasional">Operasional</option>
              <option value="lainnya">Lainnya</option>
            </select>
          </div>

          <div class="form-group">
            <label>Nominal (Rp) *</label>
            <input type="number" id="expenseAmount" min="1000" step="1000" placeholder="Contoh: 50000" required>
          </div>

          <div class="form-group">
            <label>Deskripsi</label>
            <textarea id="expenseDesc" placeholder="Contoh: Beli kopi arabika 5kg..." rows="3"></textarea>
          </div>

          <button type="submit" class="btn btn-confirm" style="width: 100%;">
            <i class="fas fa-floppy-disk"></i> Catat Pengeluaran
          </button>
        </form>
      </div>

      <div class="expense-list" id="expensesList"></div>
    </div>
  </div>

  <!-- Image Modal -->
  <div id="imageModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 15, 12, 0.75); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
    <div style="position: relative;">
      <img id="modalImage" src="" alt="Proof" style="max-width: 90vw; max-height: 90vh; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); border: 2px solid var(--border-color);">
      <button onclick="closeImageModal()" style="position: absolute; top: -16px; right: -16px; background: var(--danger); color: #ffffff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; box-shadow: var(--shadow-md); font-weight: bold; display: flex; align-items: center; justify-content: center;">✕</button>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('staffToken');
    let currentStaff = JSON.parse(localStorage.getItem('currentStaff'));

    // Check if logged in
    if (!token || !currentStaff) {
      window.location.href = '/staff-login.html';
    }

    // Set welcome message
    document.querySelector('#staffName').textContent = currentStaff.name;

    function logout() {
      localStorage.removeItem('staffToken');
      localStorage.removeItem('currentStaff');
      window.location.href = '/staff-login.html';
    }

    function switchTab(tabName) {
      // Hide all tabs
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

      // Show selected tab
      document.querySelector(`#tab-${tabName}`).classList.add('active');
      event.target.closest('.tab-btn').classList.add('active');
      if (tabName === 'kasir') loadKasirMenu();

      // Load content
      if (tabName === 'orders') {
        loadPendingOrders();
      } else if (tabName === 'sales') {
        loadSalesData();
      } else if (tabName === 'expenses') {
        loadExpenses();
      }
    }

    async function loadPendingOrders() {
      try {
        const response = await fetch('/api/pending', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load orders');

        const data = await response.json();
        displayPendingOrders(data.data);
      } catch (error) {
        console.error('Error:', error);
        document.querySelector('#ordersList').innerHTML = '<p style="color:var(--danger); font-weight:700;">Gagal memuat pesanan</p>';
      }
    }

    function updateOrdersBadge(count) {
      const badge = document.getElementById('ordersBadge');
      if (!badge) return;
      if (count > 0) {
        badge.textContent = count > 99 ? '99+' : String(count);
        badge.classList.add('show');
      } else {
        badge.classList.remove('show');
        badge.textContent = '0';
      }
    }

    function toggleOrderCard(el) {
      const card = el.closest('.order-card');
      if (!card) return;
      card.classList.toggle('open');
    }

    function buildOrderCard(order) {
      const statusLabel = (order.status || '').replace(/_/g, ' ').toUpperCase();
      const statusClass = 'status-' + (order.status || 'pending');
      const timeStr = new Date(order.timestamp).toLocaleString('id-ID');
      const itemsHtml = (order.items || []).map(item => `
              <div class="order-item">
                <span>• ${item.name} (${item.variant}) ×${item.quantity}</span>
                <span>Rp ${(item.price * item.quantity).toLocaleString('id-ID')}</span>
              </div>
            `).join('');
      const proofHtml = order.paymentProof ? `
            <div class="payment-proof">
              <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"><i class="fas fa-image"></i> BUKTI PEMBAYARAN:</strong>
              <img src="${order.paymentProof}" class="proof-image" onclick="event.stopPropagation(); showImage(this.src)" alt="Proof">
            </div>
          ` : '';
      const notesHtml = order.notes ? `
            <div style="background: var(--bg-main); padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13.5px; border: 1px solid var(--border-color); color: var(--text-main);">
              <strong style="color: var(--brand-primary);"><i class="fas fa-pen"></i> Catatan:</strong> ${order.notes}
            </div>
          ` : '';
      let actions = '';
      if (order.status === 'pending_verification') {
        actions = `
              <button class="btn btn-confirm" onclick="event.stopPropagation(); updateOrderStatus('${order.id}', 'confirmed')"><i class="fas fa-check"></i> Terima (Terverifikasi)</button>
              <button class="btn btn-reject" onclick="event.stopPropagation(); updateOrderStatus('${order.id}', 'rejected')"><i class="fas fa-xmark"></i> Tolak</button>`;
      } else if (order.status === 'pending') {
        actions = `
              <button class="btn btn-confirm" onclick="event.stopPropagation(); updateOrderStatus('${order.id}', 'confirmed')"><i class="fas fa-check"></i> Terima Pesanan</button>`;
      } else if (order.status === 'confirmed') {
        actions = `
              <button class="btn btn-complete" onclick="event.stopPropagation(); updateOrderStatus('${order.id}', 'completed')"><i class="fas fa-check-double"></i> Pesanan Siap</button>`;
      }

      return `
        <div class="order-card ${order.status}" data-order-id="${order.id}">
          <div class="order-summary" onclick="toggleOrderCard(this)">
            <div class="sum-main">
              <div class="sum-name">${(order.customer && order.customer.name) || '-'}</div>
              <div class="sum-meta">
                <span><i class="fas fa-chair"></i> ${(order.customer && order.customer.tableNo) || '-'}</span>
                <span><i class="far fa-clock"></i> ${timeStr}</span>
              </div>
            </div>
            <div class="sum-total">Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
            <i class="fas fa-chevron-down sum-chevron" aria-hidden="true"></i>
          </div>
          <div class="order-detail">
            <div class="order-header">
              <div>
                <div class="order-id"><i class="fas fa-hashtag" style="color:var(--brand-accent);"></i> ${order.id}</div>
                <small style="color: var(--text-muted);"><i class="far fa-clock"></i> ${timeStr}</small>
              </div>
              <div class="order-status ${statusClass}">${statusLabel}</div>
            </div>
            <div class="order-info">
              <div class="info-item">
                <div class="info-label"><i class="fas fa-user"></i> Pemesan</div>
                <div class="info-value">${(order.customer && order.customer.name) || '-'}</div>
              </div>
              <div class="info-item">
                <div class="info-label"><i class="fas fa-chair"></i> Nomor Meja</div>
                <div class="info-value">${(order.customer && order.customer.tableNo) || '-'}</div>
              </div>
              <div class="info-item">
                <div class="info-label"><i class="fas fa-credit-card"></i> Metode Bayar</div>
                <div class="info-value">${(order.paymentMethod || '').toUpperCase()}</div>
              </div>
              <div class="info-item">
                <div class="info-label"><i class="fas fa-wallet"></i> Total</div>
                <div class="info-value">Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
              </div>
            </div>
            <div class="order-items">
              <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"><i class="fas fa-utensils"></i> PESANAN:</strong>
              ${itemsHtml}
              <div class="order-total">Total: Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
            </div>
            ${proofHtml}
            ${notesHtml}
            <div class="action-buttons">${actions}</div>
          </div>
        </div>`;
    }

    let currentOrderSubTab = 'incoming';
    let cachedPendingOrders = [];

    function setOrderSubTab(which) {
      currentOrderSubTab = which === 'preparing' ? 'preparing' : 'incoming';
      const btnIn = document.getElementById('subtabIncoming');
      const btnPr = document.getElementById('subtabPreparing');
      if (btnIn && btnPr) {
        btnIn.classList.toggle('active', currentOrderSubTab === 'incoming');
        btnPr.classList.toggle('active', currentOrderSubTab === 'preparing');
        btnIn.setAttribute('aria-selected', currentOrderSubTab === 'incoming' ? 'true' : 'false');
        btnPr.setAttribute('aria-selected', currentOrderSubTab === 'preparing' ? 'true' : 'false');
      }
      renderOrdersBySubTab();
    }

    function displayPendingOrders(orders) {
      cachedPendingOrders = Array.isArray(orders) ? orders : [];
      const sorted = [...cachedPendingOrders].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const incoming = sorted.filter(o => o.status === 'pending' || o.status === 'pending_verification');
      const preparing = sorted.filter(o => o.status === 'confirmed');
      updateOrdersBadge(incoming.length + preparing.length);
      const cIn = document.getElementById('countIncoming');
      const cPr = document.getElementById('countPreparing');
      if (cIn) cIn.textContent = String(incoming.length);
      if (cPr) cPr.textContent = String(preparing.length);
      renderOrdersBySubTab();
    }

    function renderOrdersBySubTab() {
      const container = document.querySelector('#ordersList');
      if (!container) return;
      const sorted = [...cachedPendingOrders].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      const incoming = sorted.filter(o => o.status === 'pending' || o.status === 'pending_verification');
      const preparing = sorted.filter(o => o.status === 'confirmed');
      const list = currentOrderSubTab === 'preparing' ? preparing : incoming;
      const emptyMsg = currentOrderSubTab === 'preparing'
        ? 'Belum ada pesanan untuk disiapkan'
        : 'Tidak ada pesanan baru masuk';

      if (!list.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-inbox"></i></div><p>' + emptyMsg + '</p></div>';
        return;
      }
      container.innerHTML = list.map(o => buildOrderCard(o)).join('');
    }

    async function updateOrderStatus(orderId, newStatus) {
      try {
        const response = await fetch('/api/update-status', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            orderId: orderId,
            status: newStatus
          })
        });

        if (!response.ok) throw new Error('Failed to update order');

        showToast('Status pesanan berhasil diperbarui', 'success');
        loadPendingOrders();
        const salesTab = document.getElementById('tab-sales');
        if (salesTab && salesTab.classList.contains('active')) loadSalesData();
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal memperbarui status pesanan', 'error');
      }
    }

    async function loadSalesData() {
      try {
        const response = await fetch('/api/summary?period=today', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to load sales');

        const data = await response.json();
        displaySalesStats(data.data);
        await loadTodayCompletedOrders();
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal memuat data penjualan', 'error');
      }
    }

    async function loadTodayCompletedOrders() {
      const listEl = document.getElementById('dailyOrdersList');
      if (!listEl) return;
      try {
        const response = await fetch('/api/orders?status=completed', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!response.ok) throw new Error('Failed');
        const data = await response.json();
        const today = new Date().toISOString().split('T')[0];
        const orders = (data.data || [])
          .filter(o => (o.timestamp || '').startsWith(today))
          .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

        if (!orders.length) {
          listEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon"><i class="fas fa-receipt"></i></div><p>Belum ada pesanan selesai hari ini</p></div>';
          return;
        }

        listEl.innerHTML = orders.map(order => `
          <div class="order-card completed" style="margin-bottom:12px;">
            <div class="order-summary" style="cursor:default;">
              <div class="sum-main">
                <div class="sum-name">${(order.customer && order.customer.name) || '-'}</div>
                <div class="sum-meta">
                  <span><i class="fas fa-chair"></i> ${(order.customer && order.customer.tableNo) || '-'}</span>
                  <span><i class="far fa-clock"></i> ${new Date(order.timestamp).toLocaleString('id-ID')}</span>
                  <span class="order-status status-completed" style="display:inline-flex;padding:2px 8px;font-size:10px;">SELESAI</span>
                </div>
              </div>
              <div class="sum-total">Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
            </div>
            <div class="order-detail" style="display:block;padding:0 18px 16px;border-top:1px solid var(--border-color);padding-top:12px;">
              <div class="order-items" style="margin:0;">
                <strong style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;"><i class="fas fa-utensils"></i> PESANAN:</strong>
                ${(order.items || []).map(item => `
                  <div class="order-item">
                    <span>• ${item.name} (${item.variant}) ×${item.quantity}</span>
                    <span>Rp ${(item.price * item.quantity).toLocaleString('id-ID')}</span>
                  </div>
                `).join('')}
                <div class="order-total">Total: Rp ${(order.totalPrice || 0).toLocaleString('id-ID')}</div>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        listEl.innerHTML = '<p style="color:var(--danger);font-weight:700;">Gagal memuat pesanan hari ini</p>';
      }
    }

    function displaySalesStats(stats) {
      const container = document.querySelector('#salesStats');
      container.innerHTML = `
        <div class="stat-card">
          <div class="stat-value">${stats.totalOrders}</div>
          <div class="stat-label">Total Pesanan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">${stats.completedOrders}</div>
          <div class="stat-label">Pesanan Selesai</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${stats.totalRevenue.toLocaleString('id-ID')}</div>
          <div class="stat-label">Total Penjualan</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">Rp ${Math.round(stats.averageOrderValue).toLocaleString('id-ID')}</div>
          <div class="stat-label">Rata-rata Pesanan</div>
        </div>
      `;
    }

    async function addExpense(event) {
      event.preventDefault();

      const category = document.querySelector('#expenseCategory').value;
      const amount = parseInt(document.querySelector('#expenseAmount').value);
      const description = document.querySelector('#expenseDesc').value;

      try {
        const response = await fetch('/api/add-expense', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({
            category: category,
            amount: amount,
            description: description,
            date: new Date().toISOString().split('T')[0]
          })
        });

        if (!response.ok) throw new Error('Failed to add expense');

        showToast('Pengeluaran berhasil dicatat', 'success');
        event.target.reset();
        setTimeout(() => { loadExpenses(); }, 600);
      } catch (error) {
        console.error('Error:', error);
        showToast('Gagal mencatat pengeluaran', 'error');
      }
    }

    async function loadExpenses() {
      const listEl = document.querySelector('#expensesList');
      listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 700;">Memuat...</p>';

      try {
        const response = await fetch('/api/expenses?period=today', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) throw new Error('Failed to fetch expenses');

        const result = await response.json();
        const expenses = result.data || [];

        if (expenses.length === 0) {
          listEl.innerHTML = '<p style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 700;">Belum ada pengeluaran hari ini</p>';
          return;
        }

        listEl.innerHTML = expenses.map(exp => `
          <div class="expense-item">
            <div class="expense-info">
              <div class="expense-category"><i class="fas fa-tag" style="color:var(--brand-accent); font-size:12px; margin-right:6px;"></i>${exp.category}</div>
              <div class="expense-note">${exp.description || '-'}</div>
            </div>
            <div class="expense-amount">Rp ${exp.amount.toLocaleString('id-ID')}</div>
          </div>
        `).join('');
      } catch (error) {
        listEl.innerHTML = '<p style="text-align: center; color: var(--danger); padding: 40px; font-weight: 700;">Gagal memuat daftar pengeluaran</p>';
      }
    }

    function showImage(src) {
      document.querySelector('#modalImage').src = src;
      document.querySelector('#imageModal').style.display = 'flex';
    }

    function closeImageModal() {
      document.querySelector('#imageModal').style.display = 'none';
    }

    function showToast(msg, type) {
      type = type || 'info';
      const container = document.getElementById('toastContainer');
      if (!container) return;
      // Strip HTML tags and leading check symbols to avoid double icons
      let text = String(msg == null ? '' : msg)
        .replace(/<[^>]*>/g, ' ')
        .replace(/[✓✔✅]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
      if (!text) text = type === 'success' ? 'Berhasil' : (type === 'error' ? 'Terjadi kesalahan' : 'Info');
      const icons = { success: 'fa-circle-check', error: 'fa-circle-exclamation', info: 'fa-circle-info' };
      // Limit stacked toasts
      while (container.children.length >= 3) container.firstElementChild.remove();
      const item = document.createElement('div');
      item.className = 'toast-item ' + type;
      item.innerHTML = '<i class="fas ' + (icons[type] || icons.info) + '" aria-hidden="true"></i><div class="toast-body"></div><button type="button" class="toast-close" aria-label="Tutup">×</button>';
      item.querySelector('.toast-body').textContent = text;
      const close = () => {
        if (!item.parentNode) return;
        item.classList.add('hiding');
        setTimeout(() => item.remove(), 250);
      };
      item.querySelector('.toast-close').addEventListener('click', close);
      container.appendChild(item);
      setTimeout(close, 3500);
    }

    function showSuccessMessage(msg) { showToast(msg, 'success'); }
    function showErrorMessage(msg) { showToast(msg, 'error'); }
    function clearMessages() {}
    function showSuccessMessageExpense(msg) { showToast(msg, 'success'); }
    function showErrorMessageExpense(msg) { showToast(msg, 'error'); }
    function clearExpenseMessages() {}

    // Load initial data + light polling for badge/orders
    loadPendingOrders();
    setInterval(() => {
      const ordersTab = document.getElementById('tab-orders');
      if (ordersTab && ordersTab.classList.contains('active')) {
        loadPendingOrders();
      } else {
        // still refresh badge count quietly
        fetch('/api/pending', { headers: { 'Authorization': 'Bearer ' + token } })
          .then(r => r.ok ? r.json() : null)
          .then(d => {
            if (!d) return;
            const list = d.data || [];
            const n = list.filter(o => ['pending','pending_verification','confirmed'].includes(o.status)).length;
            updateOrdersBadge(n);
          }).catch(() => {});
      }
    }, 12000);

        // ─── KASIR (professional list + overlay, no native prompt) ───
    let kasirCart = [];
    let kasirMenuCache = [];
    let kasirCatFilter = 'all';
    let kasirSearchQ = '';
    let kasirPendingItem = null;
    let kasirSheetQty = 1;
    let kasirSheetVariant = '';

    async function loadKasirMenu() {
      const list = document.getElementById('kasirMenuList');
      if (!list) return;
      list.innerHTML = '<div class="kasir-empty">Memuat menu...</div>';
      try {
        const res = await fetch('/api/list', { cache: 'no-store' });
        const data = await res.json();
        kasirMenuCache = (data.data || []).slice().sort((a, b) =>
          String(a.name || '').localeCompare(String(b.name || ''), 'id', { sensitivity: 'base' })
        );
        buildKasirCategories();
        renderKasirMenuList();
      } catch (e) {
        list.innerHTML = '<div class="kasir-empty" style="color:var(--danger)">Gagal memuat menu</div>';
      }
    }

    function buildKasirCategories() {
      const cats = [...new Set(kasirMenuCache.map(i => i.category).filter(Boolean))].sort();
      const wrap = document.getElementById('kasirCatShortcuts');
      if (!wrap) return;
      wrap.innerHTML = '<button type="button" class="kasir-shortcut active" data-cat="all">Semua</button>' +
        cats.map(c => '<button type="button" class="kasir-shortcut" data-cat="' + c + '">' + c + '</button>').join('');
      wrap.querySelectorAll('.kasir-shortcut').forEach(btn => {
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.kasir-shortcut').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          kasirCatFilter = btn.dataset.cat;
          renderKasirMenuList();
        });
      });
    }

    function getFilteredKasirMenu() {
      let items = kasirMenuCache;
      if (kasirCatFilter !== 'all') {
        items = items.filter(i => i.category === kasirCatFilter);
      }
      if (kasirSearchQ.trim()) {
        const q = kasirSearchQ.toLowerCase();
        items = items.filter(i =>
          (i.name || '').toLowerCase().includes(q) ||
          (i.category || '').toLowerCase().includes(q) ||
          (i.description || '').toLowerCase().includes(q)
        );
      }
      return items;
    }

    function renderKasirMenuList() {
      const list = document.getElementById('kasirMenuList');
      if (!list) return;
      const items = getFilteredKasirMenu();
      if (!items.length) {
        list.innerHTML = '<div class="kasir-empty"><i class="fas fa-search" style="font-size:24px;opacity:.5;display:block;margin-bottom:8px;"></i>Menu tidak ditemukan</div>';
        return;
      }
      list.innerHTML = items.map((item, idx) => {
        const hasImg = item.image && (String(item.image).startsWith('data:') || String(item.image).startsWith('http'));
        const thumb = hasImg
          ? '<img src="' + item.image + '" alt="" loading="lazy">'
          : '<div class="kasir-thumb-placeholder"><i class="fas fa-mug-saucer"></i></div>';
        return '<button type="button" class="kasir-menu-row" data-idx="' + kasirMenuCache.indexOf(item) + '">' +
          thumb +
          '<div class="info"><div class="name">' + escapeHtml(item.name) + '</div>' +
          '<div class="meta">' + escapeHtml(item.category || '') +
          ((item.variants && item.variants.length) ? ' · ' + item.variants.length + ' varian' : '') +
          '</div></div>' +
          '<div class="price">Rp ' + Number(item.price).toLocaleString('id-ID') + '</div>' +
          '<div class="add-hint"><i class="fas fa-plus"></i></div>' +
          '</button>';
      }).join('');
      list.querySelectorAll('.kasir-menu-row').forEach(row => {
        row.addEventListener('click', () => {
          const item = kasirMenuCache[parseInt(row.dataset.idx, 10)];
          if (item) openKasirSheet(item);
        });
      });
    }

    function escapeHtml(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function openKasirSheet(item) {
      kasirPendingItem = item;
      kasirSheetQty = 1;
      const variants = (item.variants && item.variants.length) ? item.variants : ['Regular'];
      kasirSheetVariant = variants[0];

      const thumb = document.getElementById('kasirSheetThumb');
      const hasImg = item.image && (String(item.image).startsWith('data:') || String(item.image).startsWith('http'));
      thumb.innerHTML = hasImg
        ? '<img src="' + item.image + '" alt="">'
        : '<div class="ph"><i class="fas fa-mug-saucer"></i></div>';

      document.getElementById('kasirSheetTitle').textContent = item.name;
      document.getElementById('kasirSheetPrice').textContent = 'Rp ' + Number(item.price).toLocaleString('id-ID');
      document.getElementById('kasirSheetQty').textContent = '1';

      const vWrap = document.getElementById('kasirVariantBtns');
      vWrap.innerHTML = variants.map((v, i) =>
        '<button type="button" class="variant-btn' + (i === 0 ? ' active' : '') + '" data-v="' + escapeHtml(v) + '">' + escapeHtml(v) + '</button>'
      ).join('');
      vWrap.querySelectorAll('.variant-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          vWrap.querySelectorAll('.variant-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          kasirSheetVariant = btn.dataset.v;
        });
      });

      document.getElementById('kasirOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeKasirSheet() {
      document.getElementById('kasirOverlay').classList.remove('show');
      document.body.style.overflow = '';
      kasirPendingItem = null;
    }

    function confirmKasirSheet() {
      if (!kasirPendingItem) return;
      const item = kasirPendingItem;
      const variant = kasirSheetVariant || 'Regular';
      const qty = kasirSheetQty;
      const existing = kasirCart.find(c => String(c.menuId) === String(item.id) && c.variant === variant);
      if (existing) existing.quantity += qty;
      else kasirCart.push({
        menuId: String(item.id),
        name: item.name,
        price: item.price,
        variant: variant,
        quantity: qty
      });
      renderKasirCart();
      closeKasirSheet();
    }

    function changeKasirQty(idx, delta) {
      if (!kasirCart[idx]) return;
      kasirCart[idx].quantity += delta;
      if (kasirCart[idx].quantity < 1) kasirCart.splice(idx, 1);
      renderKasirCart();
    }

    function removeKasirItem(idx) {
      kasirCart.splice(idx, 1);
      renderKasirCart();
    }

    function renderKasirCart() {
      const el = document.getElementById('kasirCartItems');
      if (!el) return;
      if (!kasirCart.length) {
        el.innerHTML = '<div class="kasir-empty">Belum ada item</div>';
      } else {
        el.innerHTML = kasirCart.map((c, i) =>
          '<div class="kasir-cart-item">' +
          '<div class="ci-info"><div class="ci-name">' + escapeHtml(c.name) + '</div>' +
          '<div class="ci-var">' + escapeHtml(c.variant) + '</div></div>' +
          '<div class="kasir-qty">' +
          '<button type="button" onclick="changeKasirQty(' + i + ',-1)" aria-label="Kurangi">−</button>' +
          '<span>' + c.quantity + '</span>' +
          '<button type="button" onclick="changeKasirQty(' + i + ',1)" aria-label="Tambah">+</button>' +
          '</div>' +
          '<div class="ci-price">Rp ' + (c.price * c.quantity).toLocaleString('id-ID') + '</div>' +
          '<button type="button" class="rm" onclick="removeKasirItem(' + i + ')" aria-label="Hapus">×</button>' +
          '</div>'
        ).join('');
      }
      const total = kasirCart.reduce((s, c) => s + c.price * c.quantity, 0);
      const totalEl = document.getElementById('kasirTotal');
      if (totalEl) totalEl.textContent = 'Rp ' + total.toLocaleString('id-ID');
    }

    async function submitKasirOrder(e) {
      e.preventDefault();
      const successEl = document.getElementById('kasirSuccess');
      const errorEl = document.getElementById('kasirError');
      if (successEl) successEl.classList.remove('show');
      if (errorEl) errorEl.classList.remove('show');

      if (!kasirCart.length) {
        showToast('Tambahkan minimal 1 menu', 'error');
        return;
      }

      const customerName = document.getElementById('kasirCustomerName').value.trim();
      const tableNo = document.getElementById('kasirTableNo').value.trim();
      const paymentMethod = (document.querySelector('input[name="kasirPay"]:checked') || {}).value || 'cash';
      const notes = document.getElementById('kasirNotes').value.trim();
      const token = localStorage.getItem('staffToken');

      try {
        const res = await fetch('/api/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            customerName: customerName,
            tableNo: tableNo,
            items: kasirCart,
            paymentMethod: paymentMethod,
            notes: notes,
            source: 'staff',
            voucherCode: (document.getElementById('kasirVoucherCode')?.value || '').trim()
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Gagal membuat pesanan');

        showToast('Pesanan ' + data.orderId + ' berhasil dibuat & otomatis terverifikasi!', 'success');
        kasirCart = [];
        renderKasirCart();
        document.getElementById('kasirForm').reset();
        document.getElementById('kasirTableNo').value = 'Kasir';
        if (typeof loadPendingOrders === 'function') loadPendingOrders();
      } catch (err) {
        showToast(err.message || 'Terjadi kesalahan', 'error');
      }
    }

    // Wire overlay controls once DOM ready
    (function initKasirUI() {
      const search = document.getElementById('kasirSearch');
      if (search) {
        search.addEventListener('input', (e) => {
          kasirSearchQ = e.target.value;
          renderKasirMenuList();
        });
      }
      const overlay = document.getElementById('kasirOverlay');
      if (overlay) {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) closeKasirSheet();
        });
      }
      const minus = document.getElementById('kasirSheetMinus');
      const plus = document.getElementById('kasirSheetPlus');
      const cancel = document.getElementById('kasirSheetCancel');
      const add = document.getElementById('kasirSheetAdd');
      if (minus) minus.addEventListener('click', () => {
        if (kasirSheetQty > 1) {
          kasirSheetQty--;
          document.getElementById('kasirSheetQty').textContent = String(kasirSheetQty);
        }
      });
      if (plus) plus.addEventListener('click', () => {
        kasirSheetQty++;
        document.getElementById('kasirSheetQty').textContent = String(kasirSheetQty);
      });
      if (cancel) cancel.addEventListener('click', closeKasirSheet);
      if (add) add.addEventListener('click', confirmKasirSheet);
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('kasirOverlay')?.classList.contains('show')) {
          closeKasirSheet();
        }
      });
    })();


  
    document.getElementById('kasirVoucherCode')?.addEventListener('blur', async () => {
      const code = (document.getElementById('kasirVoucherCode')?.value || '').trim();
      const hint = document.getElementById('kasirVoucherHint');
      if (!hint) return;
      if (!code) { hint.textContent = ''; return; }
      try {
        const res = await fetch('/api/loyalty/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (!res.ok) { hint.style.color = 'var(--danger)'; hint.textContent = data.error || 'Kode tidak valid'; return; }
        hint.style.color = 'var(--success, #2e7d32)';
        const d = data.data;
        hint.textContent = d.type === 'discount_nominal'
          ? ('✓ Diskon Rp ' + Number(d.discountValue||0).toLocaleString('id-ID'))
          : ('✓ Gratis: ' + (d.freeItemName||''));
      } catch { hint.textContent = ''; }
    });

</script>
