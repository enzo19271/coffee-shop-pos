<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop - Order Online</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* ── Reset & Base Variables ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Theme Color Palette */
      --brand-primary: #3d2410;
      --brand-primary-light: #523318;
      --brand-accent: #c88a4b;
      --brand-accent-hover: #b07538;
      --brand-accent-subtle: rgba(200, 138, 75, 0.12);
      
      --bg-main: #f8f6f3;
      --bg-card: #ffffff;
      
      --text-main: #1e1915;
      --text-muted: #786f66;
      --text-light: #a3998e;
      
      --border-color: #eae5df;
      --border-focus: #c88a4b;
      
      /* Status Colors */
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --danger: #c62828;
      --danger-bg: #ffebee;
      
      /* Visual Elements */
      --shadow-sm: 0 2px 8px rgba(30, 25, 21, 0.04);
      --shadow-md: 0 8px 24px rgba(30, 25, 21, 0.07);
      --shadow-lg: 0 16px 36px rgba(30, 25, 21, 0.12);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 60px;
    }

    /* ── Custom Scrollbar ── */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d1c8bd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--brand-accent);
    }

    /* ── Header Hero Section ── */
    header {
      background: linear-gradient(135deg, var(--brand-primary) 0%, #1a1613 100%);
      color: #ffffff;
      padding: 40px 20px 36px 20px;
      text-align: center;
      position: relative;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      border-bottom: 3px solid var(--brand-accent);
    }

    header::after {
      content: '';
      position: absolute;
      top: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 300px;
      background: radial-gradient(circle, rgba(200, 138, 75, 0.2) 0%, rgba(0,0,0,0) 70%);
      pointer-events: none;
    }

    header h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    header h1 i {
      color: var(--brand-accent);
    }

    header p {
      font-size: 14px;
      color: var(--text-light);
      font-weight: 500;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Main Container ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ── Floating Cart Badge Button ── */
    .cart-badge {
      position: fixed;
      bottom: 32px;
      right: 32px;
      background: linear-gradient(135deg, var(--brand-accent), #965b21);
      color: #ffffff;
      padding: 0 24px;
      height: 56px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(200, 138, 75, 0.4);
      z-index: 500;
      transition: var(--transition);
      border: 2px solid rgba(255, 255, 255, 0.2);
      letter-spacing: 0.3px;
      gap: 8px;
    }

    .cart-badge:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 14px 30px rgba(200, 138, 75, 0.5);
    }

    /* ── Menu Grid & Cards ── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 30px;
    }

    .menu-item {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 22px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .menu-item:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-accent);
    }

    .menu-emoji {
      font-size: 42px;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .menu-emoji img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .menu-category {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--brand-accent);
      font-weight: 800;
      margin-bottom: 4px;
    }

    .menu-name {
      font-weight: 800;
      font-size: 17px;
      color: var(--brand-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .menu-price {
      color: var(--brand-primary);
      font-weight: 800;
      font-size: 18px;
      margin-bottom: 14px;
    }

    /* ── MODERN VARIANT CHIPS SELECTOR ── */
    .variant-wrapper {
      margin-bottom: 14px;
    }

    .variant-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .variant-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .variant-chip {
      padding: 8px 14px;
      background: var(--bg-main);
      border: 1.5px solid var(--border-color);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      outline: none;
      user-select: none;
    }

    .variant-chip:hover {
      border-color: var(--brand-accent);
      color: var(--brand-primary);
      background: var(--brand-accent-subtle);
      transform: translateY(-1px);
    }

    .variant-chip.active {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      color: #ffffff;
      border-color: var(--brand-accent);
      box-shadow: 0 4px 10px rgba(200, 138, 75, 0.35);
    }

    /* ── Quantity Control ── */
    .quantity-control {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      background: var(--bg-main);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
    }

    .quantity-control button {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--brand-primary);
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quantity-control button:hover {
      background: var(--brand-accent);
      color: #ffffff;
      border-color: var(--brand-accent);
    }

    .quantity-control input {
      width: 48px;
      text-align: center;
      border: none;
      background: transparent;
      font-weight: 800;
      font-size: 15px;
      color: var(--brand-primary);
    }

    .quantity-control input:focus {
      outline: none;
    }

    .add-to-cart {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light));
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: var(--transition);
      letter-spacing: 0.3px;
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .add-to-cart:hover {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(200, 138, 75, 0.3);
    }

    /* ── Modal Styling ── */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(18, 15, 12, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--brand-primary);
    }

    .close-btn {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .close-btn:hover {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: rgba(198, 40, 40, 0.2);
    }

    /* Cart Items in Modal */
    .cart-items {
      margin-bottom: 24px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      gap: 12px;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-name {
      font-weight: 700;
      font-size: 14px;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .cart-item-variant {
      font-size: 12px;
      color: var(--brand-accent);
      font-weight: 600;
    }

    .cart-item-price {
      font-weight: 800;
      color: var(--brand-primary);
      width: 90px;
      text-align: right;
      font-size: 14px;
    }

    /* Cart Summary Box */
    .cart-summary {
      background: var(--bg-main);
      padding: 18px 20px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--border-color);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .summary-total {
      font-weight: 800;
      font-size: 18px;
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
      margin-top: 8px;
      margin-bottom: 0;
      color: var(--brand-primary);
    }

    /* Form Styles in Modal */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--brand-accent-subtle);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-group small {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Payment Option Selectors */
    .payment-methods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .payment-option {
      padding: 12px 8px;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .payment-option i {
      font-size: 14px;
      color: var(--brand-accent);
    }

    .payment-option:hover {
      border-color: var(--brand-accent);
      background: var(--brand-accent-subtle);
      color: var(--brand-primary);
    }

    .payment-option input {
      display: none;
    }

    .payment-option:has(input:checked),
    .payment-option.selected {
      border-color: var(--brand-accent);
      background: var(--brand-accent-subtle);
      color: var(--brand-primary);
      box-shadow: 0 0 0 2px var(--brand-accent);
    }

    .proof-upload {
      display: none;
      margin-top: 18px;
    }

    .proof-upload.show {
      display: block;
    }

    /* Modal Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: var(--transition);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--brand-accent), #a06325);
      color: #ffffff;
      flex: 1;
      box-shadow: 0 4px 14px rgba(200, 138, 75, 0.3);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #b87b3d, #8d531a);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(200, 138, 75, 0.4);
    }

    .btn-secondary {
      background: #f0eae1;
      color: var(--brand-primary);
      border: 1px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #e2d9cc;
    }

    /* Alerts and Empty State */
    .empty-cart {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    .empty-cart-icon {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--brand-accent);
      opacity: 0.8;
    }

    .success-message {
      display: none;
      background: var(--success-bg);
      color: var(--success);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid rgba(46, 125, 50, 0.2);
      font-size: 13.5px;
      font-weight: 700;
    }

    .success-message.show {
      display: block;
    }

    .error-message {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 14px 18px;
      border-radius: var(--radius-md);
      margin-bottom: 20px;
      border: 1px solid rgba(198, 40, 40, 0.2);
      font-size: 13.5px;
      font-weight: 700;
    }

    .error-message.show {
      display: block;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 20px 16px;
      }

      .menu-grid {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }

      .menu-item {
        padding: 14px;
      }

      .menu-emoji {
        font-size: 32px;
      }

      .menu-name {
        font-size: 14px;
      }

      .menu-price {
        font-size: 15px;
      }

      .payment-methods {
        grid-template-columns: 1fr;
      }

      .cart-badge {
        bottom: 20px;
        right: 20px;
        height: 50px;
        padding: 0 18px;
        font-size: 13.5px;
      }

      .modal-content {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><i class="fas fa-mug-saucer"></i> Coffee Shop Online</h1>
    <p>Pesan menu favorit Anda langsung dari meja atau mana saja</p>
  </header>

  <div class="container">
    <div id="menuGrid" class="menu-grid"></div>
  </div>

  <div class="cart-badge" id="cartBadge"><i class="fas fa-cart-shopping"></i> 0</div>

  <!-- Cart Modal -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2><i class="fas fa-receipt" style="color: var(--brand-accent); margin-right: 8px;"></i> Keranjang Belanja</h2>
        <button class="close-btn" onclick="closeCart()"><i class="fas fa-xmark"></i></button>
      </div>

      <div id="successMessage" class="success-message"></div>
      <div id="errorMessage" class="error-message"></div>

      <div id="cartItems" class="cart-items"></div>

      <div id="cartSummary" class="cart-summary">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">Rp 0</span>
        </div>
        <div class="summary-row">
          <span>Pajak (10%):</span>
          <span id="tax">Rp 0</span>
        </div>
        <div class="summary-row summary-total">
          <span>Total:</span>
          <span id="total">Rp 0</span>
        </div>
      </div>

      <form id="orderForm" onsubmit="submitOrder(event)">
        <div class="form-group">
          <label>Nama Pemesan *</label>
          <input type="text" id="customerName" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label>Nomor Meja *</label>
          <input type="text" id="tableNo" placeholder="Contoh: 5, A3" required>
        </div>

        <div class="form-group">
          <label>Metode Pembayaran *</label>
          <div class="payment-methods">
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="cash" checked onchange="toggleProofUpload()">
              <span><i class="fas fa-money-bill-wave"></i> Cash</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="transfer" onchange="toggleProofUpload()">
              <span><i class="fas fa-building-columns"></i> Transfer</span>
            </label>
            <label class="payment-option">
              <input type="radio" name="paymentMethod" value="barcode" onchange="toggleProofUpload()">
              <span><i class="fas fa-qrcode"></i> QRIS</span>
            </label>
          </div>
        </div>

        <div id="proofUpload" class="proof-upload">
          <div class="form-group">
            <label>Bukti Pembayaran *</label>
            <input type="file" id="paymentProof" accept="image/*">
            <small>Upload foto bukti transfer/barcode pembayaran Anda</small>
          </div>
        </div>

        <div class="form-group">
          <label>Catatan Pesanan</label>
          <textarea id="notes" placeholder="Contoh: Kurang gula, tanpa es..."></textarea>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="closeCart()">Batal</button>
          <button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Pesan Sekarang</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    // Load menu saat page load
    async function loadMenu() {
      try {
        const response = await fetch('/api/list', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        displayMenu(data.data);
      } catch (error) {
        console.error('Error loading menu:', error);
        document.querySelector('.menu-grid').innerHTML = '<p>Gagal memuat menu</p>';
      }
    }

    function displayMenu(menuItems) {
      const grid = document.querySelector('.menu-grid');
      grid.innerHTML = menuItems.map(item => `
        <div class="menu-item">
          <div class="menu-emoji">
            ${item.image && (item.image.startsWith('data:') || item.image.startsWith('http')) ? `<img src="${item.image}" alt="${item.name}" />` : `<span style="font-size: 48px;">${item.image || '☕'}</span>`}
          </div>
          <div class="menu-category">${item.category}</div>
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">Rp ${item.price.toLocaleString('id-ID')}</div>
          
          <div class="variant-wrapper">
            <label class="variant-label">Pilih Varian:</label>
            <div class="variant-chips">
              ${(item.variants || []).map(v => `
                <button type="button" class="variant-chip" onclick="selectVariantChip(this, '${v}')">${v}</button>
              `).join('')}
            </div>
            <!-- Hidden Select untuk menjaga 100% kompatibilitas JS -->
            <select class="variant-select" data-menu-id="${item.id}" style="display:none;">
              <option value="">Pilih varian...</option>
              ${(item.variants || []).map(v => `<option value="${v}">${v}</option>`).join('')}
            </select>
          </div>

          <div class="quantity-control">
            <button type="button" onclick="decreaseQty(this)">−</button>
            <input type="number" class="qty-input" value="1" min="1">
            <button type="button" onclick="increaseQty(this)">+</button>
          </div>

          <button class="add-to-cart" onclick="addToCart('${item.id}', '${item.name}', ${item.price}, this)">
            <i class="fas fa-cart-plus"></i> Tambah ke Keranjang
          </button>
        </div>
      `).join('');
    }

    // Helper untuk memilih Varian Chip
    function selectVariantChip(chipBtn, value) {
      const container = chipBtn.closest('.menu-item');
      const select = container.querySelector('.variant-select');
      
      // Reset status aktif chip lain dalam card yang sama
      container.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('active'));
      
      // Berikan class active ke chip yang ditekan
      chipBtn.classList.add('active');
      
      // Set nilai ke hidden select element
      select.value = value;
    }

    function increaseQty(btn) {
      const input = btn.previousElementSibling;
      input.value = parseInt(input.value) + 1;
    }

    function decreaseQty(btn) {
      const input = btn.nextElementSibling;
      if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
      }
    }

    function addToCart(menuId, menuName, price, button) {
      const container = button.parentElement;
      const variantSelect = container.querySelector('.variant-select');
      const qtyInput = container.querySelector('.qty-input');
      const variant = variantSelect.value;
      const quantity = parseInt(qtyInput.value);

      if (!variant) {
        alert('Pilih varian terlebih dahulu');
        return;
      }

      const item = {
        menuId: menuId,
        name: menuName,
        price: price,
        variant: variant,
        quantity: quantity
      };

      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();

      // Reset
      variantSelect.value = '';
      qtyInput.value = 1;

      // Hapus status active dari chip varian secara visual
      container.querySelectorAll('.variant-chip').forEach(c => c.classList.remove('active'));

      // Show feedback
      button.innerHTML = '<i class="fas fa-check"></i> Ditambahkan';
      button.style.background = 'var(--success)';
      setTimeout(() => {
        button.innerHTML = '<i class="fas fa-cart-plus"></i> Tambah ke Keranjang';
        button.style.background = '';
      }, 1500);
    }

    function updateCartBadge() {
      document.querySelector('#cartBadge').innerHTML = `<i class="fas fa-cart-shopping"></i> ${cart.length}`;
    }

    document.querySelector('#cartBadge').addEventListener('click', openCart);

    function openCart() {
      document.querySelector('#cartModal').classList.add('active');
      displayCart();
    }

    function closeCart() {
      document.querySelector('#cartModal').classList.remove('active');
      clearMessages();
    }

    function displayCart() {
      const container = document.querySelector('#cartItems');
      const cartSummary = document.querySelector('#cartSummary');

      if (cart.length === 0) {
        container.innerHTML = '<div class="empty-cart"><div class="empty-cart-icon"><i class="fas fa-box-open"></i></div><p>Keranjang Anda masih kosong</p></div>';
        cartSummary.style.display = 'none';
        document.querySelector('#orderForm').style.display = 'none';
        return;
      }

      cartSummary.style.display = 'block';
      document.querySelector('#orderForm').style.display = 'block';

      let subtotal = 0;
      container.innerHTML = cart.map((item, idx) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name} (×${item.quantity})</div>
              <div class="cart-item-variant">${item.variant}</div>
            </div>
            <div class="cart-item-price">Rp ${itemTotal.toLocaleString('id-ID')}</div>
            <button type="button" onclick="removeFromCart(${idx})" style="background: var(--danger-bg); color: var(--danger); border: 1px solid rgba(198,40,40,0.2); padding: 6px 10px; border-radius: var(--radius-sm); cursor: pointer; font-weight: bold;"><i class="fas fa-trash-can"></i></button>
          </div>
        `;
      }).join('');

      const tax = Math.round(subtotal * 0.1);
      const total = subtotal + tax;

      document.querySelector('#subtotal').textContent = `Rp ${subtotal.toLocaleString('id-ID')}`;
      document.querySelector('#tax').textContent = `Rp ${tax.toLocaleString('id-ID')}`;
      document.querySelector('#total').textContent = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartBadge();
      displayCart();
    }

    function toggleProofUpload() {
      const method = document.querySelector('input[name="paymentMethod"]:checked').value;
      const proofUpload = document.querySelector('#proofUpload');
      const proofInput = document.querySelector('#paymentProof');

      if (method === 'cash') {
        proofUpload.classList.remove('show');
        proofInput.removeAttribute('required');
      } else {
        proofUpload.classList.add('show');
        proofInput.setAttribute('required', 'required');
      }
    }

    async function submitOrder(event) {
      event.preventDefault();
      clearMessages();

      if (cart.length === 0) {
        showError('Keranjang Anda masih kosong');
        return;
      }

      const customerName = document.querySelector('#customerName').value;
      const tableNo = document.querySelector('#tableNo').value;
      const paymentMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const notes = document.querySelector('#notes').value;
      const proofInput = document.querySelector('#paymentProof');

      let paymentProof = null;

      // Handle payment proof upload
      if (paymentMethod !== 'cash' && proofInput.files.length > 0) {
        try {
          const file = proofInput.files[0];
          paymentProof = await fileToBase64(file);
        } catch (error) {
          showError('Gagal mengupload bukti pembayaran');
          return;
        }
      }

      try {
        const response = await fetch('/api/create', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            customerName: customerName,
            tableNo: tableNo,
            items: cart,
            paymentMethod: paymentMethod,
            paymentProof: paymentProof,
            notes: notes
          })
        });

        const data = await response.json();

        if (!response.ok) {
          showError(data.error || 'Gagal membuat pesanan');
          return;
        }

        showSuccess(`<i class="fas fa-circle-check"></i> Pesanan berhasil dibuat! ID: ${data.orderId}`);
        
        // Clear cart
        cart = [];
        localStorage.removeItem('cart');
        updateCartBadge();
        displayCart();

        // Reset form
        document.querySelector('#orderForm').reset();
        toggleProofUpload();

        setTimeout(() => {
          closeCart();
        }, 2000);

      } catch (error) {
        console.error('Order error:', error);
        showError('Terjadi kesalahan saat membuat pesanan');
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsDataURL(file);
      });
    }

    function showSuccess(message) {
      const el = document.querySelector('#successMessage');
      el.innerHTML = message;
      el.classList.add('show');
    }

    function showError(message) {
      const el = document.querySelector('#errorMessage');
      el.innerHTML = message;
      el.classList.add('show');
    }

    function clearMessages() {
      document.querySelector('#successMessage').classList.remove('show');
      document.querySelector('#errorMessage').classList.remove('show');
    }

    // Initialize
    loadMenu();
    updateCartBadge();

    // Close modal when clicking outside
    document.querySelector('#cartModal').addEventListener('click', (e) => {
      if (e.target.id === 'cartModal') {
        closeCart();
      }
    });
  </script>
</body>
</html>
