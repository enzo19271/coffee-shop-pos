<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login - Coffee Shop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    .login-box {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 64px;
      margin-bottom: 20px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-message {
      display: none;
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 20px;
      border: 1px solid #f5c6cb;
      font-size: 14px;
    }

    .error-message.show {
      display: block;
    }

    .demo-credentials {
      background: #f0f7ff;
      padding: 15px;
      border-radius: 4px;
      margin-top: 20px;
      font-size: 12px;
      border-left: 4px solid #667eea;
    }

    .demo-credentials strong {
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    .demo-credentials p {
      margin-bottom: 5px;
      color: #666;
    }

    .demo-credentials p:last-child {
      margin-bottom: 0;
    }

    .loading {
      display: none;
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-top: 15px;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .back-to-menu {
      text-align: center;
      margin-top: 20px;
    }

    .back-to-menu a {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .back-to-menu a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="login-box">
      <div class="logo">☕</div>
      <h1>Coffee Shop</h1>
      <p class="subtitle">Staff & Admin Login</p>

      <div id="errorMessage" class="error-message"></div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>

        <button type="submit" class="login-btn">Login</button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          Sedang login...
        </div>
      </form>

      <div class="demo-credentials">
        <strong>📝 Demo Credentials:</strong>
        <p><strong>Staff:</strong> username: staff, password: password</p>
        <p><strong>Admin:</strong> username: admin, password: admin</p>
      </div>

      <div class="back-to-menu">
        <a href="/">← Kembali ke Menu Pelanggan</a>
      </div>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('staffToken')) {
      const role = JSON.parse(localStorage.getItem('currentStaff')).role;
      if (role === 'admin') {
        window.location.href = '/admin.html';
      } else {
        window.location.href = '/staff.html';
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      
      const username = document.querySelector('#username').value;
      const password = document.querySelector('#password').value;
      const errorMsg = document.querySelector('#errorMessage');
      const loading = document.querySelector('#loading');

      // Clear previous error
      errorMsg.classList.remove('show');

      // Show loading
      loading.style.display = 'block';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Login failed');
        }

        // Store token and user info
        localStorage.setItem('staffToken', data.token);
        localStorage.setItem('currentStaff', JSON.stringify(data.user));

        // Redirect based on role
        if (data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/staff.html';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = '❌ ' + error.message;
        errorMsg.classList.add('show');
        loading.style.display = 'none';
      }
    }
  </script>
</body>
</html>
